name: Patch coupon-aware ranking

on:
  push:
    paths:
      - '.github/workflows/patch-coupon-ranking.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build coupon-aware checker
        run: python3 .github/scripts/patch_coupon_ranking.py
      - name: Validate JavaScript
        run: |
          node --check checker-20260907-coupons.js
          grep -q 'クーポンを順位に反映' checker-20260907-coupons.js
          grep -q 'checker-20260907-coupons.js?v=20260907-coupons1' index.html
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add checker-20260907-coupons.js index.html app-v2.html app-v3.html
          git commit -m "feat: rank PayPay and Vpass coupons [skip ci]"
          git push origin HEAD:main
