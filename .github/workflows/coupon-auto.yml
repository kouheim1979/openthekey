name: Auto refresh payment coupons

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/**'
      - '.github/workflows/coupon-auto.yml'
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

concurrency:
  group: coupon-auto
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Public page reader dependencies
        run: |
          python3 -m pip install beautifulsoup4==4.13.4 playwright==1.58.0
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - name: Validate catalogue and calculation logic
        run: |
          python3 scripts/test_public_coupons.py
          node scripts/test_coupon_runtime.js
      - name: Fetch official public coupons without login
        run: python3 scripts/update_coupon_feed.py
      - name: Build compact coupon-aware app
        run: python3 scripts/build_auto_coupon_checker.py
      - name: Validate browser and mobile layout
        run: |
          node --check checker-20260907-autocoupons.js
          python3 -m json.tool coupon-feed.json >/dev/null
          grep -q 'checker-20260907-autocoupons.js?v=20260907-auto4' index.html
          python3 scripts/test_coupon_browser.py
      - name: Upload visual regression results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-coupon-validation
          retention-days: 1
          path: |
            test-results/
            coupon-feed.json
      - name: Commit refreshed coupon data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coupon-feed.json checker-20260907-autocoupons.js index.html app-v2.html app-v3.html
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh verified public coupon catalogues [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "coupon data unchanged"
          fi
