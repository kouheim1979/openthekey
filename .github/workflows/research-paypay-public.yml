name: Inspect public PayPay coupon sources
on:
  push:
    paths: ['.github/workflows/research-paypay-public.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install playwright==1.58.0
      - name: Render public pages without login or claiming
        run: |
          mkdir -p research
          python3 - <<'PY'
          from playwright.sync_api import sync_playwright
          import shutil,json
          from pathlib import Path
          urls={
            'seasonal':'https://www.paypay.ne.jp/portal/coupon-corner/seasonal-coupons?seasonId=1800747966076723200',
            'detail':'https://www.paypay.ne.jp/portal/coupon-corner/coupons/100372197',
            'lyp':'https://premium.yahoo.co.jp/benefit/coupon/paypay',
          }
          with sync_playwright() as p:
            browser=p.chromium.launch(executable_path=shutil.which('google-chrome'),headless=True,args=['--no-sandbox'])
            for key,url in urls.items():
              ctx=browser.new_context(locale='ja-JP',viewport={'width':390,'height':844})
              page=ctx.new_page();log=[]
              page.on('response',lambda r:log.append({'url':r.url,'status':r.status,'type':r.request.resource_type}))
              try:
                page.goto(url,wait_until='domcontentloaded',timeout=30000)
                page.wait_for_timeout(12000)
                Path('research/'+key+'.html').write_text(page.content())
                Path('research/'+key+'.txt').write_text(page.locator('body').inner_text())
                Path('research/'+key+'-network.json').write_text(json.dumps(log,ensure_ascii=False,indent=2))
                page.screenshot(path='research/'+key+'.png',full_page=True)
                print(key,page.url,page.locator('body').inner_text()[:3500])
                print(key,'api status',[(r['status'],r['url']) for r in log if r['type'] in ('xhr','fetch')])
              except Exception as e: print(key,'error',str(e))
              ctx.close()
            browser.close()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: coupon-anonymous-browser
          retention-days: 1
          path: research/
