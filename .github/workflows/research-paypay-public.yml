name: Inspect public PayPay coupon sources
on:
  push:
    paths: ['.github/workflows/research-paypay-public.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Read linked public pages without login
        run: |
          mkdir -p research
          python3 - <<'PY'
          import urllib.request, urllib.parse, re, json
          from pathlib import Path
          urls = {
            'seasonal': 'https://www.paypay.ne.jp/portal/coupon-corner/seasonal-coupons?seasonId=1800747966076723200',
            'coupon-detail': 'https://www.paypay.ne.jp/portal/coupon-corner/coupons/100372197',
            'lyp': 'https://premium.yahoo.co.jp/benefit/coupon/paypay?ex=P_2778.C_C4pps462',
            'softbank-landing': 'https://www.softbank.jp/mobile/special/paypay-otoku-2022/?p=paypay-coupon',
            'softbank-monthly.pdf': 'https://www.softbank.jp/mobile/set/data/info/personal/news/service/20260824a/pdf/targetstores_aug_20260824.pdf',
          }
          for key,url in urls.items():
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept-Language':'ja'})
              with urllib.request.urlopen(req,timeout=20) as r:
                raw=r.read(); print(key, 'status',r.status,'url',r.url,'bytes',len(raw))
              if key.endswith('.pdf'):
                Path('research/'+key).write_bytes(raw);continue
              body=raw.decode('utf-8',errors='replace');Path('research/'+key+'.html').write_text(body)
              scripts=re.findall(r'<script[^>]*src=[\"\x27]([^\"\x27]+)',body,re.I)
              print(key,'scripts',scripts)
              print(key,'preview',re.sub(r'<[^>]+>',' ',body)[-1500:])
              manifest={}
              for i,src in enumerate(scripts):
                target=urllib.parse.urljoin(url,src); host=urllib.parse.urlparse(target).hostname or ''
                if not any(host==h or host.endswith('.'+h) for h in ('paypay.ne.jp','yimg.jp','premium.yahoo.co.jp')): continue
                if len(scripts)>15 and i>=15: break
                try:
                  with urllib.request.urlopen(target,timeout=15) as r: js=r.read().decode('utf-8',errors='replace')
                  file=key+'-script-'+str(i)+'.js';Path('research/'+file).write_text(js);manifest[file]=target
                  print('script',target,'bytes',len(js))
                except Exception as e: print('script error',str(e))
              Path('research/'+key+'-scripts.json').write_text(json.dumps(manifest))
            except Exception as e: print(key,'ERROR',str(e))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: public-coupon-paths
          retention-days: 1
          path: research/
