name: Patch Vpass coupon bridge

on:
  push:
    paths:
      - '.github/workflows/patch-vpass-coupon-bridge.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch persistent coupon builder
        run: python3 .github/scripts/patch_vpass_coupon_bridge.py
      - name: Rebuild current coupon app
        run: python3 scripts/build_auto_coupon_checker.py
      - name: Validate Jolly Pasta bridge
        run: |
          node --check checker-20260907-autocoupons.js
          grep -q 'vpassCouponCard' checker-20260907-autocoupons.js
          grep -q '三井住友カード / Olive' checker-20260907-autocoupons.js
          grep -q 'checker-20260907-autocoupons.js?v=20260907-auto3' index.html
          grep -q 'ジョリーパスタ' coupon-feed.json
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/build_auto_coupon_checker.py .github/workflows/coupon-auto.yml checker-20260907-autocoupons.js index.html app-v2.html app-v3.html
          git commit -m "fix: bridge Vpass coupons to card candidates [skip ci]"
          git push origin HEAD:main
