<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0d12"><title>支払いチェッカー</title><style>
:root{--bg:#0b0d12;--card:#12161f;--line:#252b37;--txt:#f7f8fb;--mut:#8b93a3;--accent:#7d8cff}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI","Hiragino Sans",sans-serif;background:radial-gradient(circle at 15% -10%,#242c48,transparent 34%),var(--bg);color:var(--txt);-webkit-font-smoothing:antialiased}body{padding-bottom:max(16px,env(safe-area-inset-bottom))}.app{max-width:700px;margin:auto;padding:0 11px 18px}.top{position:sticky;top:0;z-index:10;padding:9px 0 8px;background:linear-gradient(#0b0d12 78%,transparent);backdrop-filter:blur(18px)}.bar{display:flex;justify-content:space-between;align-items:center;height:34px;padding:0 2px}.brand{font-weight:850;font-size:17px;letter-spacing:-.03em}.ver{font-size:9px;color:#737b8b;font-weight:850;letter-spacing:.08em}.searchrow{display:grid;grid-template-columns:1fr 46px;gap:8px}.searchbox{height:47px;border:1px solid var(--line);background:#141922;border-radius:16px;display:flex;align-items:center;padding:0 13px;gap:8px}.searchbox svg{width:17px;color:#8991a0}.search{width:100%;border:0;outline:0;background:transparent;color:white;font-size:15px;font-weight:700}.search::placeholder{color:#737b89}.geo{border:0;border-radius:16px;background:linear-gradient(135deg,#6677ff,#927bff);color:white;display:grid;place-items:center}.geo svg{width:19px}.cands{display:flex;gap:6px;overflow:auto;padding:7px 0 0;scrollbar-width:none}.cands:empty{display:none}.cand,.quick button{border:1px solid var(--line);background:#151a23;color:#dce1eb;border-radius:999px;padding:8px 11px;font-size:11px;font-weight:800;white-space:nowrap}.status{display:none;padding:6px 2px 0;color:#9199a7;font-size:10.5px;font-weight:700}.status.show{display:block}.status.err{color:#ff7585}.welcome{padding:16px 2px}.kicker{font-size:10px;color:#747d8c;letter-spacing:.14em;font-weight:900}.welcome h1{font-size:31px;line-height:1.07;letter-spacing:-.055em;margin:9px 0}.welcome h1 span{color:#aab4ff}.lead{font-size:13px;line-height:1.6;color:#929aa9;font-weight:630}.ql{margin-top:19px;font-size:9.5px;color:#6f7787;letter-spacing:.12em;font-weight:900}.quick{display:flex;gap:7px;overflow:auto;padding:8px 0;scrollbar-width:none}.notice{margin-top:8px;border:1px solid var(--line);background:#11151d;border-radius:18px;padding:12px 13px;color:#a1a8b5;font-size:11px;line-height:1.5}.result{display:none;padding-top:4px}.result.show{display:block}.sheet{background:linear-gradient(#121720,#0f131b);border:1px solid var(--line);border-radius:25px;padding:11px;box-shadow:0 20px 50px rgba(0,0,0,.3)}.storehead{display:flex;justify-content:space-between;align-items:flex-start;padding:2px 2px 9px}.hint{font-size:9px;color:#747c8b;letter-spacing:.08em;font-weight:900}.store{font-size:22px;font-weight:880;letter-spacing:-.045em;margin-top:2px}.reset{border:0;background:#202632;color:#aeb5c2;border-radius:11px;padding:7px 9px;font-size:10px;font-weight:800}.hero{--c:#7d8cff;position:relative;overflow:hidden;min-height:120px;padding:14px;border-radius:20px;background:linear-gradient(135deg,#202630,#10141b)}.hero:after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;right:-72px;top:-95px;background:var(--c);opacity:.5}.herotop,.herobody{position:relative;z-index:2}.herotop{display:flex;justify-content:space-between}.pill{font-size:8.5px;font-weight:900;letter-spacing:.1em;background:#ffffff18;border-radius:999px;padding:5px 8px}.rate{font-size:29px;font-weight:920;letter-spacing:-.055em}.method{font-size:22px;font-weight:900;letter-spacing:-.04em;margin-top:18px}.sub{font-size:10px;color:#ffffff99;font-weight:680;margin-top:4px}.ranks{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:7px}.rank{background:#171c25;border:1px solid var(--line);border-radius:16px;padding:9px 10px}.rl{font-size:8.5px;color:#747c8b;font-weight:900}.rm{display:flex;justify-content:space-between;gap:5px;margin-top:3px}.rn{font-size:12.5px;font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rr{font-size:13px;font-weight:920}.section{margin-top:8px}.sh{display:flex;justify-content:space-between;margin:0 2px 5px}.st{font-size:9px;color:#747c8b;font-weight:900}.sn{font-size:8.5px;color:#626a78}.pts{display:flex;gap:5px;overflow:auto;scrollbar-width:none}.pt{flex:0 0 auto;border-radius:999px;padding:7px 9px;font-size:10px;font-weight:830;background:#202631;color:#cbd1dc}.r{background:#36181f;color:#ff9cad}.p{background:#372c18;color:#ffc96a}.d{background:#37181e;color:#ff99a7}.v{background:#173129;color:#82dfbd}.s{background:#262842;color:#afb6ff}.combo{margin-top:7px;border:1px solid #31375b;background:#1b1f34;border-radius:16px;padding:9px 10px;display:flex;gap:8px}.plus{width:27px;height:27px;border-radius:9px;background:#292e4b;color:#aeb7ff;display:grid;place-items:center;font-weight:900}.ck{font-size:8.5px;color:#7f89c7;font-weight:900}.ct{font-size:10.5px;line-height:1.45;color:#c5cbe0;font-weight:700;margin-top:2px}details{margin-top:7px;border-top:1px solid var(--line)}summary{list-style:none;padding:9px 2px 4px;color:#7c8492;font-size:10px;font-weight:850;display:flex;justify-content:space-between}summary::-webkit-details-marker{display:none}summary:after{content:"＋";font-size:16px}.detail{background:#151a23;border-radius:12px;padding:8px 9px;margin-top:6px}.detail b{display:block;font-size:8.5px;color:#707888;margin-bottom:4px}.detail p{margin:0;font-size:10px;line-height:1.5;color:#a5adba;font-weight:670}.chips{display:flex;flex-wrap:wrap;gap:4px}.chip{border:1px solid var(--line);background:#10141b;border-radius:8px;padding:5px 7px;color:#aab1bd;font-size:9px;font-weight:760}.hidden{display:none!important}@media(max-width:430px){.welcome h1{font-size:27px}.sheet{border-radius:22px;padding:9px}.hero{min-height:110px;padding:12px}.method{font-size:20px;margin-top:14px}.rate{font-size:26px}}
</style></head><body><div class="app"><header class="top"><div class="bar"><div class="brand">支払いチェッカー</div><div class="ver">V3 · FIXED</div></div><div class="searchrow"><label class="searchbox"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="search" class="search" type="search" placeholder="店名を検索  例：ジョリパ、セブン"></label><button id="geo" class="geo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button></div><div id="status" class="status"></div><div id="cands" class="cands"></div></header><main><section id="welcome" class="welcome"><div class="kicker">PAYMENT COMPASS</div><h1>その店で、<span>いちばん得な払い方</span>だけ。</h1><div class="lead">検索すると、上位3つ・提示ポイント・組み合わせを1画面で表示します。</div><div class="ql">QUICK ACCESS</div><div id="quick" class="quick"></div><div class="notice">PayPayは1.5%で統一。三菱UFJ対象店はMDCアプリ表示12.5%を現在値として使用。</div></section><section id="result" class="result"></section></main></div><script>
'use strict';const $=id=>document.getElementById(id),P=(n,r,k='s',x='')=>({n,r,k,x}),Y=(n,r,x='')=>({n,r,x});
const A={olive:['ミニストップ','マクドナルド','モスバーガー','ケンタッキー','吉野家','すき家','サイゼリヤ','ガスト','バーミヤン','しゃぶ葉','ジョナサン','夢庵','から好し','はま寿司','かっぱ寿司','ココス','ドトール','エクセルシオール'],mufg:['くら寿司','スシロー','松屋','松のや','マイカリー食堂','ピザハット','ゼッテリア','オーケー','東急ストア','三和・フードワン','オオゼキ','肉のハナマサ','ジャパンミート'],plain:['CoCo壱番屋','かつや','からやま','丸亀製麺','びっくりドンキー','横浜家','天狗','魁力屋','一風堂','タリーズ','なか卯','ジョリーパスタ','ビッグボーイ','オリーブの丘']};
const AL={'ジョリーパスタ':['ジョリパ'],'セブン-イレブン':['セブン','セブンイレブン'],'オーケー':['OK','オケ','オーケーストア'],'マクドナルド':['マック','マクド'],'ケンタッキー':['ケンタ'],'バーミヤン':['バミ'],'はま寿司':['はま'],'丸亀製麺':['丸亀'],'CoCo壱番屋':['ココイチ'],'タリーズ':['タリ']};
function payset(n){if(n==='セブン-イレブン'||n==='ローソン')return[Y('三菱UFJカード','12.5%'),Y('Olive','8%'),Y('PayPay','1.5%')];if(n==='オーケー')return[Y('三菱UFJカード','12.5%'),Y('OKクラブ現金','3%相当','対象食料品'),Y('PayPay','1.5%')];if(n==='東急ストア')return[Y('三菱UFJカード','12.5%'),Y('楽天ペイ','1.5%','条件達成時'),Y('PayPay','1.5%')];if(n==='ジョリーパスタ')return[Y('楽天ペイ','1.5%','条件達成時'),Y('PayPay','1.5%'),Y('d払い','1.0%','dカード設定時'),Y('au PAY','0.5%')];if(A.mufg.includes(n))return[Y('三菱UFJカード','12.5%'),Y('PayPay','1.5%'),Y('Olive通常','0.5%')];if(A.olive.includes(n))return[Y('Olive','8%'),Y('PayPay','1.5%'),Y('三菱UFJ通常','0.5%')];if(n==='タリーズ')return[Y('楽天ペイ','1.5%','条件達成時'),Y('PayPay','1.5%'),Y('Olive通常','0.5%')];return[Y('PayPay','1.5%'),Y('Olive通常','0.5%'),Y('三菱UFJ通常','0.5%')]}
function points(n){const sky=['ガスト','バーミヤン','しゃぶ葉','ジョナサン','夢庵','から好し'];if(sky.includes(n))return[P('楽天','0.5%','r'),P('d','0.5%','d'),P('V','0.5%','v'),P('すかいらーく','0.5%','s','併用可')];const zen=['はま寿司','ココス','なか卯','ジョリーパスタ','ビッグボーイ','オリーブの丘'];if(zen.includes(n))return[P('楽天','0.5%','r'),P('d','0.5%','d'),P('V','0.5%','v')];if(n==='すき家')return[P('楽天','0.5%','r'),P('Ponta','0.5%','p'),P('d','0.5%','d'),P('V','0.5%','v')];if(n==='ローソン')return[P('Ponta','約0.5〜1.0%','p'),P('d','約0.5〜1.0%','d')];if(n==='ケンタッキー')return[P('楽天','約0.5%','r'),P('Ponta','約0.5%','p')];if(n==='吉野家'||n==='くら寿司'||n==='タリーズ'||n==='東急ストア')return[P('楽天','約0.5%','r')];if(n==='丸亀製麺'||n==='マクドナルド')return[P('楽天ポイント','終了','s')];return[]}
function combo(n){if(n==='ジョリーパスタ')return'楽天0.5%＋楽天ペイ1.5%＝2.0%。楽天＋PayPayでも2.0%。';if(n==='ローソン')return'PayPay1.5%＋Pontaで約2.0〜2.5%。三菱UFJなら約13.0〜13.5%。';if(n==='すき家')return'PayPay1.5%＋提示0.5%＝2.0%。Ponta＋au PAYなら1.0%。';if(n==='東急ストア')return'楽天約0.5%＋TOKYU POINT約0.5%を併用可。';if(points(n).length)return'提示ポイントは支払い還元とは別に加算できます。';return'支払い還元を比較。'}
function cond(n){if(n==='ジョリーパスタ'||n==='タリーズ')return'楽天ペイ1.5%は対象期間に楽天ポイントカードを2回以上提示してポイント獲得した場合。未達時は最大1.0%。';if(n==='セブン-イレブン'||n==='ローソン'||A.mufg.includes(n))return'三菱UFJはMDCアプリ表示12.5%を現在値として使用。対象店・条件を満たす場合。';if(A.olive.includes(n))return'Olive 8%は対象店でクレジットモードのスマホタッチ等を利用。';return'特別な達成条件なし。'}
const names=['セブン-イレブン','ローソン',...A.olive,...A.mufg,...A.plain],seen=new Set(),S=[];for(const n of names){if(seen.has(n))continue;seen.add(n);S.push({n,a:[n,...(AL[n]||[])],pay:payset(n),pts:points(n),combo:combo(n),cond:cond(n)})}
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c])),N=s=>String(s||'').normalize('NFKC').toLowerCase().replace(/[ー‐-‒–—―\-−\s　・･'’`]/g,'').trim(),R=s=>{const m=String(s).match(/(12\.5|8|3|1\.5|1\.0|0\.5)%/);return m?+m[1]:0},C=s=>s.includes('PayPay')?'#ff3150':s.includes('楽天')?'#d21d3d':s.includes('三菱UFJ')?'#c33a4c':s.includes('Olive')?'#25c89b':s.includes('au')?'#ff9c43':s.includes('d払い')?'#ef4859':'#7d8cff';
function show(s,ctx='検索結果'){const p=[...s.pay].sort((a,b)=>R(b.r)-R(a.r)),a=p[0]||Y('—',''),b=p[1]||Y('—',''),c=p[2]||Y('—',''),ph=s.pts.length?s.pts.map(x=>`<span class="pt ${x.k}">${E(x.n)} <b>${E(x.r)}</b>${x.x?' · '+E(x.x):''}</span>`).join(''):'<span class="pt">提示ポイントなし / 未確認</span>',chips=p.map(x=>`<span class="chip">${E(x.n)} ${E(x.r)}${x.x?' · '+E(x.x):''}</span>`).join('');$('welcome').classList.add('hidden');$('cands').innerHTML='';$('result').innerHTML=`<div class="sheet"><div class="storehead"><div><div class="hint">BEST PAYMENT · ${E(ctx)}</div><div class="store">${E(s.n)}</div></div><button id="reset" class="reset">別の店</button></div><div class="hero" style="--c:${C(a.n)}"><div class="herotop"><span class="pill">BEST CHOICE</span><span class="rate">${E(a.r)}</span></div><div class="herobody"><div class="method">${E(a.n)}</div><div class="sub">${E(a.x||'現在の設定で最も高い還元を優先')}</div></div></div><div class="ranks"><div class="rank"><div class="rl">SECOND</div><div class="rm"><span class="rn">${E(b.n)}</span><span class="rr">${E(b.r)}</span></div></div><div class="rank"><div class="rl">THIRD</div><div class="rm"><span class="rn">${E(c.n)}</span><span class="rr">${E(c.r)}</span></div></div></div><div class="section"><div class="sh"><div class="st">会計前に提示</div><div class="sn">支払いとは別</div></div><div class="pts">${ph}</div></div><div class="combo"><div class="plus">＋</div><div><div class="ck">BEST COMBINATION</div><div class="ct">${E(s.combo)}</div></div></div><details><summary>条件とその他の支払い</summary><div class="detail"><b>還元条件</b><p>${E(s.cond)}</p></div><div class="detail"><b>支払い候補</b><div class="chips">${chips}</div></div></details></div>`;$('result').classList.add('show');$('reset').onclick=()=>{$('result').classList.remove('show');$('welcome').classList.remove('hidden');$('search').value='';$('search').focus()}}
function match(q){const n=N(q);return n?S.filter(s=>s.a.some(a=>{const x=N(a);return x===n||x.includes(n)||n.includes(x)})).slice(0,10):[]}
function cands(a){$('cands').innerHTML=a.map((s,i)=>`<button class="cand" data-i="${i}">${E(s.n)}</button>`).join('');[...$('cands').querySelectorAll('button')].forEach((b,i)=>b.onclick=()=>show(a[i]))}
$('search').oninput=e=>{const q=e.target.value.trim(),a=match(q);cands(a);$('status').textContent=q&&!a.length?'該当する登録店がありません':'';$('status').className='status'+(q&&!a.length?' show err':'');if(a.length===1&&a[0].a.some(x=>N(x)===N(q)))show(a[0])};
const Q=['ジョリーパスタ','セブン-イレブン','ローソン','すき家','オーケー'];$('quick').innerHTML=Q.map((n,i)=>`<button data-i="${i}">${E(n)}</button>`).join('');[...$('quick').querySelectorAll('button')].forEach((b,i)=>b.onclick=()=>show(S.find(s=>s.n===Q[i])));
$('geo').onclick=()=>{$('status').textContent='現在地検索は次の更新で再有効化します。店名検索をご利用ください。';$('status').className='status show'};
</script></body></html>
