<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>命式ノート</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@500;700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap">
<style>
html,body{margin:0}img{max-width:100%}
/* Layout: a single column built around the 命式 grid (時・日・月・年, right-to-left as written), readings below as ledger rows */
:root{
  --bg:#ECEFEA; --paper:#F8F9F6; --ink:#1E2420; --muted:#5F6A62; --line:#CDD3CB;
  --seal:#B5381F; --wood:#3F7E4A; --fire:#C2412A; --earth:#A07A22; --metal:#7C8288; --water:#2F4D8C;
  --display:"Zen Old Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --mono:"DM Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131714; --paper:#1A1F1C; --ink:#E4E8E3; --muted:#9CA79F; --line:#2E3631;
  --seal:#F07558; --wood:#7FC08A; --fire:#F08068; --earth:#D9B35C; --metal:#B9C0C6; --water:#8FA9E8; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131714; --paper:#1A1F1C; --ink:#E4E8E3; --muted:#9CA79F; --line:#2E3631;
  --seal:#F07558; --wood:#7FC08A; --fire:#F08068; --earth:#D9B35C; --metal:#B9C0C6; --water:#8FA9E8; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.7}
.wrap{max-width:680px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px}
header{display:flex;align-items:center;gap:12px}
.seal{width:44px;height:44px;border:2px solid var(--seal);color:var(--seal);border-radius:6px;display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:13px;line-height:1.05;text-align:center;flex:none}
header h1{font-family:var(--display);font-weight:900;font-size:28px;letter-spacing:.08em;margin:0}
header p{margin:0;color:var(--muted);font-size:13px}
.people{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:6px 14px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.chip.add{border-style:dashed;color:var(--muted)}
.chip:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--seal);outline-offset:2px}
form{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
form .full{grid-column:1/-1}
label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);letter-spacing:.04em;min-width:0}
label.inline{flex-direction:row;align-items:center;gap:8px;font-size:13px;color:var(--ink)}
input,select{font:inherit;font-size:15px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-width:0;width:100%;box-sizing:border-box}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--seal);flex:none}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{font:inherit;font-size:14px;font-weight:700;border:0;background:var(--seal);color:var(--paper);padding:9px 18px;border-radius:6px;cursor:pointer}
.btn.danger{background:transparent;color:var(--seal);border:1px solid var(--line);font-weight:500}
.note{font-size:12px;color:var(--muted)}
.sample{display:inline-block;font-family:var(--body);font-size:11px;letter-spacing:.08em;color:var(--seal);border:1px solid var(--seal);border-radius:4px;padding:0 6px;margin-left:6px;vertical-align:middle;font-weight:500}
h2{font-family:var(--display);font-size:19px;font-weight:700;margin:0 0 10px;letter-spacing:.06em;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
h2 small{font-family:var(--body);font-size:12px;color:var(--muted);font-weight:400}
.meishiki{background:var(--paper);border:1px solid var(--line);border-radius:10px;overflow-x:auto}
.grid{display:grid;grid-template-columns:4.6em repeat(4,minmax(64px,1fr));min-width:340px}
.grid > div{padding:8px 4px;text-align:center;border-bottom:1px solid var(--line);display:flex;flex-direction:column;justify-content:center;align-items:center}
.grid .rh{font-size:11px;color:var(--muted);letter-spacing:.04em;text-align:left;align-items:flex-start;padding-left:12px}
.grid .ch{font-size:12px;color:var(--muted);font-weight:500;letter-spacing:.1em}
.grid .day{background:color-mix(in srgb,var(--seal) 7%,transparent)}
.kan{font-family:var(--display);font-weight:900;font-size:34px;line-height:1.1}
.kan small{display:block;font-family:var(--body);font-size:10px;font-weight:500;letter-spacing:.1em;margin-top:2px}
.god{font-size:13px;font-weight:700}
.god.self{color:var(--seal)}
.hid{font-family:var(--display);font-size:16px;letter-spacing:.1em}
.stage{font-size:13px}
.grid > div.last{border-bottom:0}
.e0{color:var(--wood)} .e1{color:var(--fire)} .e2{color:var(--earth)} .e3{color:var(--metal)} .e4{color:var(--water)}
.daybox{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:16px}
.daybox .big{width:72px;height:72px;border:2px solid var(--seal);border-radius:8px;display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:44px;color:var(--seal)}
.daybox h3{margin:0;font-family:var(--display);font-size:18px}
.daybox p{margin:4px 0 0;font-size:14px}
.five{display:grid;grid-template-columns:200px 1fr;gap:16px;align-items:center}
.five svg{width:100%;max-width:220px;height:auto}
.five p{margin:0 0 6px;font-size:14px}
.ledger{display:flex;flex-direction:column}
.lrow{display:grid;grid-template-columns:4.5em 1fr;gap:12px;padding:10px 0;border-top:1px solid var(--line);align-items:baseline}
.lrow b{font-family:var(--display);font-size:16px}
.lrow p{margin:0;font-size:14px}
.lrow .cnt{font-family:var(--mono);font-size:11px;color:var(--muted);margin-left:4px;font-weight:400}
.luckwrap{overflow-x:auto}
.luck{display:grid;grid-template-columns:repeat(8,minmax(64px,1fr));gap:6px;min-width:540px}
.lk{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:8px 4px;text-align:center}
.lk.now{border-color:var(--seal);box-shadow:inset 0 0 0 1px var(--seal)}
.lk .age{font-family:var(--mono);font-size:11px;color:var(--muted)}
.lk .k{font-family:var(--display);font-weight:900;font-size:22px;line-height:1.2}
.lk .g{font-size:12px}
.lk .now-tag{font-size:10px;color:var(--seal);font-weight:700}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px 12px;flex:1 1 200px;min-width:0}
.tag .k{font-size:11px;color:var(--muted);letter-spacing:.06em}
.tag .v{font-family:var(--display);font-weight:700;font-size:20px}
.tag p{margin:2px 0 0;font-size:13px}
footer{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
[hidden]{display:none!important}
@media (max-width:520px){form{grid-template-columns:1fr}.five{grid-template-columns:1fr;justify-items:center}.five div{justify-self:stretch}.kan{font-size:28px}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="seal" aria-hidden="true">四柱<br>推命</div>
    <div><h1>命式ノート</h1><p>生まれた年・月・日・時の干支から命式を出します</p></div>
  </header>

  <div class="people" id="people"></div>

  <form id="f" autocomplete="off">
    <label>名前<input id="name" maxlength="20" placeholder="例：みく"></label>
    <label>性別（大運の向きに使います）<select id="gender"><option value="f">女性</option><option value="m">男性</option><option value="">指定しない</option></select></label>
    <label>生年月日<input id="date" type="date" min="1800-01-01" max="2050-12-31" required></label>
    <label>生まれた時刻<input id="time" type="time"></label>
    <label class="inline full"><input id="unk" type="checkbox">生まれた時刻がわからない（時柱なしの三柱で出します）</label>
    <label class="full">出生地<select id="place"></select></label>
    <div class="row3 full" id="custom" hidden>
      <label>緯度（北+）<input id="lat" type="number" step="0.01" inputmode="decimal"></label>
      <label>経度（東+）<input id="lon" type="number" step="0.01" inputmode="decimal"></label>
      <label>UTCとの時差<input id="tz" type="number" step="0.5" inputmode="decimal"></label>
    </div>
    <label class="inline full"><input id="fix" type="checkbox">出生地の経度で時刻を補正する（地方時。流派によって使う・使わないが分かれます）</label>
    <div class="actions full">
      <button class="btn" type="submit">保存して表示</button>
      <button class="btn danger" type="button" id="del">この人を削除</button>
      <span class="note" id="msg"></span>
    </div>
  </form>

  <section>
    <h2 id="who">命式</h2>
    <div class="meishiki"><div class="grid" id="grid"></div></div>
    <p class="note" id="cap"></p>
  </section>

  <section class="daybox" id="daybox"></section>

  <section>
    <h2>五行のバランス<small>天干と地支の8文字</small></h2>
    <div class="five"><svg id="penta" viewBox="0 0 220 210" role="img" aria-label="五行の分布"></svg><div id="fivetxt"></div></div>
  </section>

  <section>
    <h2>持っている通変星</h2>
    <div class="ledger" id="gods"></div>
  </section>

  <section>
    <h2>そのほか</h2>
    <div class="tags" id="misc"></div>
  </section>

  <section id="lucksec">
    <h2 id="luckh">大運<small>10年ごとの運気の流れ</small></h2>
    <div class="luckwrap"><div class="luck" id="luck"></div></div>
  </section>

  <footer>
    年は立春、月は節入り（太陽の黄経）で切り替え、日は0時、時柱は23時から翌日の日干で出しています。節入り前後の数時間に生まれた人は流派によって月柱・年柱が変わることがあります。1948〜1951年の夏時間で生まれた場合は、時刻を1時間早めて入力してください。データはこのブラウザの中だけに保存されます。
  </footer>
</div>

<script>
// ===== Astro core: low-precision ephemeris (JPL approx elements 1800-2050, Meeus Sun/Moon) =====
const AC = (() => {
  const D2R = Math.PI / 180, R2D = 180 / Math.PI;
  const norm = x => ((x % 360) + 360) % 360;
  const sind = x => Math.sin(x * D2R), cosd = x => Math.cos(x * D2R);

  // JD from UTC Date
  const jd = date => date.getTime() / 86400000 + 2440587.5;
  const TT_OFFSET = 69 / 86400; // approx ΔT (days)

  // JPL Keplerian elements [a, e, I, L, varpi, Omega] and rates per century
  const EL = {
    mercury: [[0.38709927, 0.20563593, 7.00497902, 252.25032350, 77.45779628, 48.33076593], [0.00000037, 0.00001906, -0.00594749, 149472.67411175, 0.16047689, -0.12534081]],
    venus:   [[0.72333566, 0.00677672, 3.39467605, 181.97909950, 131.60246718, 76.67984255], [0.00000390, -0.00004107, -0.00078890, 58517.81538729, 0.00268329, -0.27769418]],
    earth:   [[1.00000261, 0.01671123, -0.00001531, 100.46457166, 102.93768193, 0.0], [0.00000562, -0.00004392, -0.01294668, 35999.37244981, 0.32327364, 0.0]],
    mars:    [[1.52371034, 0.09339410, 1.84969142, -4.55343205, -23.94362959, 49.55953891], [0.00001847, 0.00007882, -0.00813131, 19140.30268499, 0.44441088, -0.29257343]],
    jupiter: [[5.20288700, 0.04838624, 1.30439695, 34.39644051, 14.72847983, 100.47390909], [-0.00011607, -0.00013253, -0.00183714, 3034.74612775, 0.21252668, 0.20469106]],
    saturn:  [[9.53667594, 0.05386179, 2.48599187, 49.95424423, 92.59887831, 113.66242448], [-0.00125060, -0.00050991, 0.00193609, 1222.49362201, -0.41897216, -0.28867794]],
    uranus:  [[19.18916464, 0.04725744, 0.77263783, 313.23810451, 170.95427630, 74.01692503], [-0.00196176, -0.00004397, -0.00242939, 428.48202785, 0.40805281, 0.04240589]],
    neptune: [[30.06992276, 0.00859048, 1.77004347, -55.12002969, 44.96476227, 131.78422574], [0.00026291, 0.00005105, 0.00035372, 218.45945325, -0.32241464, -0.00508664]],
    pluto:   [[39.48211675, 0.24882730, 17.14001206, 238.92903833, 224.06891629, 110.30393684], [-0.00031596, 0.00005170, 0.00004818, 145.20780515, -0.04062942, -0.01183482]]
  };

  function helio(name, T) {
    const [e0, r] = EL[name];
    const a = e0[0] + r[0] * T, e = e0[1] + r[1] * T, I = e0[2] + r[2] * T;
    const L = e0[3] + r[3] * T, wb = e0[4] + r[4] * T, Om = e0[5] + r[5] * T;
    const w = wb - Om; let M = norm(L - wb); if (M > 180) M -= 360;
    let E = M + R2D * e * sind(M);
    for (let i = 0; i < 30; i++) {
      const dM = M - (E - R2D * e * sind(E));
      const dE = dM / (1 - e * cosd(E)); E += dE; if (Math.abs(dE) < 1e-8) break;
    }
    const xp = a * (cosd(E) - e), yp = a * Math.sqrt(1 - e * e) * sind(E);
    const cw = cosd(w), sw = sind(w), cO = cosd(Om), sO = sind(Om), cI = cosd(I), sI = sind(I);
    return [
      (cw * cO - sw * sO * cI) * xp + (-sw * cO - cw * sO * cI) * yp,
      (cw * sO + sw * cO * cI) * xp + (-sw * sO + cw * cO * cI) * yp,
      (sw * sI) * xp + (cw * sI) * yp
    ];
  }

  function sunLon(T) { // apparent, ecliptic of date
    const L0 = 280.46646 + 36000.76983 * T + 0.0003032 * T * T;
    const M = 357.52911 + 35999.05029 * T - 0.0001537 * T * T;
    const C = (1.914602 - 0.004817 * T - 0.000014 * T * T) * sind(M) + (0.019993 - 0.000101 * T) * sind(2 * M) + 0.000289 * sind(3 * M);
    const Om = 125.04 - 1934.136 * T;
    return norm(L0 + C - 0.00569 - 0.00478 * sind(Om));
  }

  function moonLon(T) {
    const L0 = 218.3164477 + 481267.88123421 * T;
    const D = 297.8501921 + 445267.1114034 * T;
    const M = 357.5291092 + 35999.0502909 * T;
    const Mp = 134.9633964 + 477198.8675055 * T;
    const F = 93.2720950 + 483202.0175233 * T;
    const lon = L0
      + 6.288774 * sind(Mp) + 1.274027 * sind(2 * D - Mp) + 0.658314 * sind(2 * D)
      + 0.213618 * sind(2 * Mp) - 0.185116 * sind(M) - 0.114332 * sind(2 * F)
      + 0.058793 * sind(2 * D - 2 * Mp) + 0.057066 * sind(2 * D - M - Mp)
      + 0.053322 * sind(2 * D + Mp) + 0.045758 * sind(2 * D - M)
      - 0.040923 * sind(M - Mp) - 0.034720 * sind(D) - 0.030383 * sind(M + Mp)
      + 0.015327 * sind(2 * D - 2 * F) - 0.012528 * sind(Mp + 2 * F)
      + 0.010980 * sind(Mp - 2 * F) + 0.010675 * sind(4 * D - Mp)
      + 0.010034 * sind(3 * Mp) + 0.008548 * sind(4 * D - 2 * Mp)
      - 0.007888 * sind(2 * D + M - Mp) - 0.006766 * sind(2 * D + M)
      - 0.005163 * sind(D - Mp) + 0.004987 * sind(D + M)
      + 0.004036 * sind(2 * D - M + Mp) + 0.003994 * sind(2 * D + 2 * Mp)
      + 0.003861 * sind(4 * D) + 0.003665 * sind(2 * D - 3 * Mp);
    return norm(lon);
  }

  function nodeLon(T) { return norm(125.0445479 - 1934.1362891 * T + 0.0020754 * T * T); }

  function planetLon(name, T) {
    const p = helio(name, T), e = helio('earth', T);
    const x = p[0] - e[0], y = p[1] - e[1];
    return norm(Math.atan2(y, x) * R2D + 1.396971 * T); // J2000 -> of date
  }

  const BODIES = ['sun', 'moon', 'mercury', 'venus', 'mars', 'jupiter', 'saturn', 'uranus', 'neptune', 'pluto', 'node'];
  function lonAt(body, T) {
    if (body === 'sun') return sunLon(T);
    if (body === 'moon') return moonLon(T);
    if (body === 'node') return nodeLon(T);
    return planetLon(body, T);
  }
  function T_of(date) { return (jd(date) + TT_OFFSET - 2451545) / 36525; }

  function positions(date) {
    const T = T_of(date), dT = 1 / 36525;
    return BODIES.map(b => {
      const l = lonAt(b, T), l2 = lonAt(b, T + dT);
      let sp = l2 - l; if (sp > 180) sp -= 360; if (sp < -180) sp += 360;
      return { body: b, lon: l, speed: sp, retro: b !== 'node' && sp < 0 };
    });
  }

  function obliquity(T) { return 23.4392911 - 0.0130042 * T; }
  function gmst(date) {
    const d = jd(date) - 2451545, T = d / 36525;
    return norm(280.46061837 + 360.98564736629 * d + 0.000387933 * T * T);
  }

  // Ascendant / MC / Placidus houses
  function houses(date, lat, lon) {
    const T = T_of(date), eps = obliquity(T);
    const ramc = norm(gmst(date) + lon);
    const mc = norm(Math.atan2(sind(ramc), cosd(ramc) * cosd(eps)) * R2D);
    const asc = norm(Math.atan2(cosd(ramc), -(sind(ramc) * cosd(eps) + Math.tan(lat * D2R) * sind(eps))) * R2D);
    const raToLon = ra => norm(Math.atan2(sind(ra), cosd(ra) * cosd(eps)) * R2D);
    let system = 'placidus';
    function cusp(kind) { // kind: 11,12,2,3
      let R = ramc + ({ 11: 30, 12: 60, 2: 120, 3: 150 })[kind];
      for (let i = 0; i < 60; i++) {
        const lam = raToLon(R);
        const dec = Math.asin(sind(eps) * sind(lam)) * R2D;
        const x = Math.tan(lat * D2R) * Math.tan(dec * D2R);
        if (Math.abs(x) >= 1) return null;
        const ad = Math.asin(x) * R2D;
        const dsa = 90 + ad, nsa = 90 - ad;
        let Rn;
        if (kind === 11) Rn = ramc + dsa / 3;
        else if (kind === 12) Rn = ramc + 2 * dsa / 3;
        else if (kind === 3) Rn = ramc + 180 - nsa / 3;
        else Rn = ramc + 180 - 2 * nsa / 3;
        if (Math.abs(Rn - R) < 1e-7) { R = Rn; break; }
        R = Rn;
      }
      return raToLon(R);
    }
    let c11 = cusp(11), c12 = cusp(12), c2 = cusp(2), c3 = cusp(3);
    if ([c11, c12, c2, c3].some(v => v === null)) { // Porphyry fallback at high latitude
      system = 'porphyry';
      const q1 = norm(asc - mc), q2 = norm(mc + 180 - asc);
      c11 = norm(mc + q1 / 3); c12 = norm(mc + 2 * q1 / 3);
      c2 = norm(asc + q2 / 3); c3 = norm(asc + 2 * q2 / 3);
    }
    const c = [asc, c2, c3, norm(mc + 180), norm(c11 + 180), norm(c12 + 180), norm(asc + 180), norm(c2 + 180), norm(c3 + 180), mc, c11, c12];
    return { asc, mc, cusps: c, system };
  }

  function houseOf(lon, cusps) {
    for (let i = 0; i < 12; i++) {
      const a = cusps[i], b = cusps[(i + 1) % 12];
      const span = norm(b - a), off = norm(lon - a);
      if (off < span) return i + 1;
    }
    return 1;
  }

  // ===== Four Pillars helpers =====
  function sunLonAtDate(date) { return sunLon(T_of(date)); }
  // find time when sun longitude crosses target near date (direction +1 next, -1 previous)
  function findSolarTerm(date, target, dir) {
    let t = date.getTime();
    const step = dir * 86400000;
    let prev = norm(sunLonAtDate(new Date(t)) - target);
    for (let i = 0; i < 400; i++) {
      const t2 = t + step;
      const cur = norm(sunLonAtDate(new Date(t2)) - target);

          const mid = (lo + hi) / 2;
          const v = norm(sunLonAtDate(new Date(mid)) - target);
          if (v > 180) lo = mid; else hi = mid;

        return new Date((lo + hi) / 2);
      }
      t = t2; prev = cur;
    }

  }

    const a = Math.floor((14 - m) / 12), yy = y + 4800 - a, mm = m + 12 * a - 3;

  }

// ===== Four Pillars computation =====
const BZ = (() => {
  const STEMS = '甲乙丙丁戊己庚辛壬癸'.split('');
  const BRANCHES = '子丑寅卯辰巳午未申酉戌亥'.split('');
  const STEM_EL = [0, 0, 1, 1, 2, 2, 3, 3, 4, 4];
  const BR_EL = [4, 2, 0, 0, 2, 1, 1, 2, 3, 3, 2, 4];
  const EL = ['木', '火', '土', '金', '水'];
  const HIDDEN = ['癸', '癸辛己', '戊丙甲', '乙', '乙癸戊', '戊庚丙', '丙己丁', '丁乙己', '戊壬庚', '辛', '辛丁戊', '甲壬'];
  const MAIN = [9, 5, 0, 1, 4, 2, 3, 5, 6, 7, 4, 8];
  const STAGES = ['長生', '沐浴', '冠帯', '建禄', '帝旺', '衰', '病', '死', '墓', '絶', '胎', '養'];
  const CS_START = [11, 6, 2, 9, 2, 9, 5, 0, 8, 3];
  const idx60 = (s, b) => ((6 * s - 5 * b) % 60 + 60) % 60;

  function tenGod(day, other) {
    const de = STEM_EL[day], oe = STEM_EL[other], same = (day % 2) === (other % 2);
    if (oe === de) return same ? '比肩' : '劫財';
    if (oe === (de + 1) % 5) return same ? '食神' : '傷官';
    if (oe === (de + 2) % 5) return same ? '偏財' : '正財';
    if (de === (oe + 2) % 5) return same ? '偏官' : '正官';
    return same ? '偏印' : '印綬';
  }
  function stage(stem, br) {
    const st = CS_START[stem];
    return STAGES[stem % 2 === 0 ? (br - st + 12) % 12 : (st - br + 12) % 12];
  }

  // p: {date:'YYYY-MM-DD', time:'HH:MM', unk, tz, lon, gender:'m'|'f', solarFix}
  function chart(p) {
    let [y, mo, d] = p.date.split('-').map(Number);
    let [hh, mi] = (p.unk ? '12:00' : (p.time || '12:00')).split(':').map(Number);
    const utc = new Date(Date.UTC(y, mo - 1, d, hh, mi) - p.tz * 3600000);
    // local (possibly solar-corrected) clock for day/hour
    let localMs = Date.UTC(y, mo - 1, d, hh, mi);
    let fixMin = 0;
    if (p.solarFix && !p.unk) { fixMin = Math.round((p.lon - p.tz * 15) * 4); localMs += fixMin * 60000; }
    const L = new Date(localMs);
    const ly = L.getUTCFullYear(), lm = L.getUTCMonth() + 1, ld = L.getUTCDate(), lh = L.getUTCHours();

    // year by Lichun
    const lambda = AC.sunLonAtDate(utc);
    let sy = y;
    const lichun = AC.findSolarTerm(new Date(Date.UTC(y, 0, 20)), 315, 1);
    if (utc < lichun) sy = y - 1;
    const yi = ((sy - 4) % 60 + 60) % 60;
    const ys = yi % 10, yb = yi % 12;
    // month
    const m = Math.floor(AC.norm(lambda - 315) / 30);
    const ms = (ys * 2 + 2 + m) % 10, mb = (m + 2) % 12;
    // day
    const jdn = AC.jdnFromYMD(ly, lm, ld);
    const di = (jdn + 49) % 60, ds = di % 10, db = di % 12;
    // hour
    let hour = null;
    if (!p.unk) {
      const hb = Math.floor((lh + 1) / 2) % 12;
      const baseStem = lh === 23 ? (ds + 1) % 10 : ds;
      hour = { s: (baseStem * 2 + hb) % 10, b: hb };
    }
    const pillars = [
      { key: '時柱', s: hour ? hour.s : null, b: hour ? hour.b : null },
      { key: '日柱', s: ds, b: db },
      { key: '月柱', s: ms, b: mb },
      { key: '年柱', s: ys, b: yb }
    ];
    pillars.forEach(pl => {
      if (pl.s === null) return;
      pl.stemGod = pl.key === '日柱' ? '日主' : tenGod(ds, pl.s);
      pl.hidden = HIDDEN[pl.b];
      pl.branchGod = tenGod(ds, MAIN[pl.b]);
      pl.stage = stage(ds, pl.b);
    });
    // five elements
    const count = [0, 0, 0, 0, 0];
    pillars.forEach(pl => { if (pl.s === null) return; count[STEM_EL[pl.s]]++; count[BR_EL[pl.b]]++; });
    // void (kuubou)
    const start = di - (di % 10);
    const voids = [(start + 10) % 12, (start + 11) % 12];
    // luck pillars
    let luck = null;
    if (p.gender === 'm' || p.gender === 'f') {
      const yang = ys % 2 === 0;
      const fwd = (yang && p.gender === 'm') || (!yang && p.gender === 'f');
      const target = AC.norm(315 + 30 * (fwd ? m + 1 : m));
      const term = AC.findSolarTerm(utc, target, fwd ? 1 : -1);
      const days = Math.abs(term - utc) / 86400000;
      let startAge = Math.round(days / 3);
      if (startAge < 1) startAge = 1;
      const base = idx60(ms, mb);
      luck = { fwd, startAge, list: [] };
      for (let k = 1; k <= 8; k++) {
        const i = ((base + (fwd ? k : -k)) % 60 + 60) % 60;
        luck.list.push({ age: startAge + (k - 1) * 10, s: i % 10, b: i % 12, god: tenGod(ds, i % 10), stage: stage(ds, i % 12) });
      }
    }
    return { pillars, dayStem: ds, count, voids, luck, fixMin, sy };
  }

  // annual pillar for a given year (from Lichun)
  function yearPillar(y) { const i = ((y - 4) % 60 + 60) % 60; return { s: i % 10, b: i % 12 }; }

  return { STEMS, BRANCHES, STEM_EL, BR_EL, EL, chart, tenGod, stage, yearPillar };
})();

function penta(count){

  const col = ['var(--wood)','var(--fire)','var(--earth)','var(--metal)','var(--water)'];

  for (let i=0;i<5;i++){ const [x1,y1]=P(i), [x2,y2]=P((i+2)%5); s+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--line)" stroke-dasharray="3 3"/>`; }
  for (let i=0;i<5;i++){ const [x1,y1]=P(i), [x2,y2]=P((i+1)%5); s+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--muted)" stroke-width="1.2"/>`; }
  for (let i=0;i<5;i++){
    const [x,y]=P(i), n=count[i], r=13+n*4.5;

    $('luck').innerHTML = c.luck.list.map(l=>{
      const isNow = age>=l.age && age<l.age+10;
      return `<div class="lk${isNow?' now':''}"><div class="age">${l.age}〜${l.age+9}歳</div><div class="k"><span class="${eCls.s(l.s)}">${S[l.s]}</span><span class="${eCls.b(l.b)}">${B[l.b]}</span></div><div class="g">${l.god}</div><div class="note">${l.stage}</div>${isNow?'<div class="now-tag">いま</div>':''}</div>`;
    }).join('');
    if (pre) $('luckh').innerHTML += `<small>（${first}歳までは月柱の運気）</small>`;
  } else $('lucksec').hidden = true;
}

function save(e){
  e.preventDefault();
  const v = readForm();
  if (!v.date){ $('msg').textContent='生年月日を入れてください'; return; }
  const i = people.findIndex(x=>x.id===cur);
  const rec = Object.assign({id: cur==='sample' ? 'p'+Date.now() : cur}, v);
  if (i>=0) people[i]=rec; else people.push(rec);
  cur = rec.id;
  people = people.filter(x=>!x.sample || x.id===cur);
  $('msg').textContent = store.set(KEY, people) ? '保存しました' : 'このブラウザでは保存できませんでした（表示はできます）';
  renderPeople(); render();
}
$('f').addEventListener('submit', save);
$('place').addEventListener('change', ()=>{ $('custom').hidden = $('place').value!=='custom'; });
$('unk').addEventListener('change', ()=>{ $('time').disabled = $('unk').checked; });
$('del').addEventListener('click', ()=>{
  if ($('del').dataset.arm!=='1'){ $('del').dataset.arm='1'; $('del').textContent='もう一度押すと削除'; return; }
  $('del').dataset.arm=''; $('del').textContent='この人を削除';
  people = people.filter(x=>x.id!==cur);
  if (!people.length) people=[SAMPLE];
  store.set(KEY, people.filter(x=>!x.sample));
  cur = people[0].id; fillForm(people[0]); renderPeople(); render(); $('msg').textContent='削除しました';
});
$('people').addEventListener('click', e=>{
  const b = e.target.closest('button'); if (!b) return;
  $('msg').textContent=''; $('del').dataset.arm=''; $('del').textContent='この人を削除';
  if (b.id==='addp'){
    const np={id:'p'+Date.now(), name:'', gender:'f', date:'', time:'', unk:false, place:'東京都', lat:'', lon:'', tz:'', fix:false};
    people.push(np); cur=np.id; fillForm(np); renderPeople(); $('name').focus(); return;
  }
  cur=b.dataset.id; fillForm(people.find(x=>x.id===cur)); renderPeople(); render();
});
renderPeople(); fillForm(people[0]); render();
</script>

</body>
