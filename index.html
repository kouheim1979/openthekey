<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>支払いチェッカー 更新中</title>
<style>body{font-family:system-ui,-apple-system,sans-serif;margin:0;min-height:100vh;display:grid;place-items:center;background:#fffaf0;color:#171225}main{padding:24px;text-align:center}strong{display:block;font-size:22px;margin-bottom:8px}</style>
</head>
<body><main><strong>支払いチェッカーを読み込み中…</strong><span>2026年9月の還元率に更新しています。</span></main>
<script>
(async()=>{
  try{
    const res=await fetch('./legacy.html?v=20260906-2',{cache:'no-store'});
    if(!res.ok) throw new Error('legacy.html '+res.status);
    let html=await res.text();

    // 2026-09-06 current reward assumptions for this checker.
    html=html.replace(/((?:first|second|third):)"PayPay\/Coke ON Pay"/g,'$1"PayPay（クレジット最大1.5%／残高最大1.0%）/Coke ON Pay"');
    html=html.replace(/((?:first|second|third):)"PayPay"/g,'$1"PayPay（クレジット最大1.5%／残高最大1.0%）"');
    html=html.replace(/((?:first|second|third):)"三井住友カード スマホタッチ\/モバイルオーダー"/g,'$1"Olive クレジットモード スマホタッチ/モバイルオーダー（8%）"');
    html=html.replace(/((?:first|second|third):)"三井住友カード スマホタッチ"/g,'$1"Olive クレジットモード スマホタッチ（8%）"');
    html=html.replace(/((?:first|second|third):)"三井住友カード モバイルオーダー"/g,'$1"Olive クレジットモード モバイルオーダー（8%）"');
    html=html.replace(/((?:first|second|third):)"三井住友カード通常"/g,'$1"三井住友カード／Olive通常（0.5%）"');
    html=html.replace(/((?:first|second|third):)"三菱UFJカード通常"/g,'$1"三菱UFJカード通常（0.5%）"');
    html=html.replace(/((?:first|second|third):)"三菱UFJカード"/g,'$1"三菱UFJカード（対象店7%〜最大20%・要条件）"');
    html=html.replace(/((?:first|second|third):)"現金＋オーケークラブ"/g,'$1"現金＋オーケークラブ（食料品3%相当割引）"');

    html=html.replaceAll('note:"三井住友対象"','note:"Oliveクレジットモードなら8%（スマホタッチ／対象モバイルオーダー）。通常利用は0.5%。"');
    html=html.replaceAll('note:"三菱UFJ対象"','note:"三菱UFJカード対象：7%〜最大20%（条件・エントリーあり）。通常利用は0.5%。"');
    html=html.replaceAll('note:"特約対象外"','note:"特約対象外：PayPayはクレジット最大1.5%／残高最大1.0%。三井住友カード・Olive通常0.5%、三菱UFJカード通常0.5%。"');
    html=html.replace('note:"店頭ではなくモバイルオーダー前提"','note:"スタバはアプリ／App Clip経由のApple PayによるモバイルオーダーでOliveクレジットモード8%。通常利用は0.5%。"');

    const patchScript=`
(function(){
  const PAYPAY="PayPay（クレジット最大1.5%／残高最大1.0%）";
  const RAKUTEN25="楽天ペイ＋楽天ポイントカード（合計最大2.5%・条件あり）";
  const SMBC_NORMAL="三井住友カード／Olive通常（0.5%）";
  const MUFG_TARGET="三菱UFJカード（対象店7%〜最大20%・要条件）";
  const OK_CASH="現金＋オーケークラブ（食料品3%相当割引）";

  function eachStore(name, fn){
    STORE_DATA.filter(s=>s.store===name).forEach(fn);
  }

  eachStore("セブン-イレブン", s=>{
    s.note="Oliveクレジットモードは8%。セブンアプリ連携など所定条件達成なら最大11%。三菱UFJカードは7%〜最大20%なので、MDCアプリ表示が8%超なら三菱UFJを優先。PayPayはクレジット最大1.5%／残高最大1.0%。";
  });

  eachStore("ローソン", s=>{
    s.note="Oliveクレジットモード8%と三菱UFJカード7%〜最大20%を比較。MDCアプリ表示が8%超なら三菱UFJを優先。PayPayはクレジット最大1.5%／残高最大1.0%。";
  });

  // 楽天ポイントカード提示＋楽天ペイ残高払いの合計最大2.5%が確認できる店舗。
  ["すき家","吉野家","はま寿司","ココス"].forEach(name=>{
    eachStore(name, s=>{
      s.second=RAKUTEN25;
      s.third=PAYPAY;
      s.note += " 楽天ポイントカード対象店では、所定条件達成の楽天ペイ残高払いと提示分を合わせて最大2.5%。";
    });
  });

  eachStore("東急ストア", s=>{
    s.first=MUFG_TARGET;
    s.second=RAKUTEN25;
    s.third=PAYPAY;
    s.note="三菱UFJカード対象：7%〜最大20%（条件・エントリーあり）。楽天ポイントカード＋楽天ペイ残高払いは条件達成で合計最大2.5%。PayPayはクレジット最大1.5%／残高最大1.0%。";
  });

  ["CoCo壱番屋","ジョリーパスタ","ビッグボーイ","ヴィクトリアステーション","熟成焼肉いちばん","華屋与兵衛","久兵衛屋"].forEach(name=>{
    eachStore(name, s=>{
      s.first=RAKUTEN25;
      s.second=PAYPAY;
      s.third=SMBC_NORMAL;
      s.note="楽天ポイントカード提示＋楽天ペイ残高払いは所定条件達成で合計最大2.5%。PayPayはクレジット最大1.5%／残高最大1.0%。通常カードは0.5%目安。";
    });
  });

  eachStore("オーケー", s=>{
    s.first=MUFG_TARGET;
    s.second=OK_CASH;
    s.third=PAYPAY;
    s.note="三菱UFJカード対象：7%〜最大20%（条件あり）。オーケークラブは現金払いの食料品（酒類除く）が3/103＝3%相当額割引。PayPayはクレジット最大1.5%／残高最大1.0%。";
  });

  const fresh=STORE_DATA.find(s=>s.store==="フレッシュネスバーガー");
  if(!fresh){
    STORE_DATA.push({
      store:"フレッシュネスバーガー",
      aliases:["フレッシュネスバーガー","フレッシュネス","freshness burger","freshnessburger"],
      first:"Olive クレジットモード スマホタッチ（8%）",
      second:PAYPAY,
      third:SMBC_NORMAL,
      note:"2026年8月1日から三井住友カード高還元の対象。Oliveクレジットモードのスマホタッチなら8%。PayPayはクレジット最大1.5%／残高最大1.0%。"
    });
  }
})();
`;

    html=html.replace('setupEmbeddedAppIcons();',patchScript+'\nsetupEmbeddedAppIcons();');
    html=html.replace('候補を選ぶと、そのお店のおすすめ支払い方法1〜3位をすぐ表示します。','候補を選ぶと、そのお店のおすすめ支払い方法1〜3位をすぐ表示します。各支払い方法に還元率・割引率も併記しています（2026年9月6日時点）。');
    html=html.replace('店舗候補はOpenStreetMapの登録状況に依存します。','店舗候補はOpenStreetMapの登録状況に依存します。<br><strong>通常時の目安</strong>：PayPay クレジット1.0%〜最大1.5%／残高0.5%〜最大1.0%・楽天ペイ残高 最大1.5%（対象店でポイントカード併用なら合計最大2.5%）・Olive通常0.5%／対象店8%・三菱UFJ通常0.5%／対象店7%〜最大20%・d払い0.5%（dカード設定1.0%）・au PAY 0.5%。');

    document.open();
    document.write(html);
    document.close();
  }catch(err){
    document.body.innerHTML='<main><strong>読み込みに失敗しました</strong><span>'+String(err.message||err)+'</span></main>';
  }
})();
</script>
</body>
</html>
