<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>支払いチェッカー 更新中</title>
<style>body{font-family:system-ui,-apple-system,sans-serif;margin:0;min-height:100vh;display:grid;place-items:center;background:#fffaf0;color:#171225}main{padding:24px;text-align:center}strong{display:block;font-size:22px;margin-bottom:8px}</style>
</head>
<body><main><strong>支払いチェッカーを読み込み中…</strong><span>2026年9月の還元率に更新しています。</span></main>
<script>
(async()=>{
  try{
    const res=await fetch('./legacy.html?v=20260906-5',{cache:'no-store'});
    if(!res.ok) throw new Error('legacy.html '+res.status);
    let html=await res.text();

    html=html.replace(/((?:first|second|third):)"PayPay\/Coke ON Pay"/g,'$1"PayPay（1.5%）/Coke ON Pay"');
    html=html.replace(/((?:first|second|third):)"PayPay"/g,'$1"PayPay（1.5%）"');
    html=html.replace(/((?:first|second|third):)"三井住友カード スマホタッチ\/モバイルオーダー"/g,'$1"Olive クレジットモード スマホタッチ/モバイルオーダー（8%）"');
    html=html.replace(/((?:first|second|third):)"三井住友カード スマホタッチ"/g,'$1"Olive クレジットモード スマホタッチ（8%）"');
    html=html.replace(/((?:first|second|third):)"三井住友カード モバイルオーダー"/g,'$1"Olive クレジットモード モバイルオーダー（8%）"');
    html=html.replace(/((?:first|second|third):)"三井住友カード通常"/g,'$1"三井住友カード／Olive通常（0.5%）"');
    html=html.replace(/((?:first|second|third):)"三菱UFJカード通常"/g,'$1"三菱UFJカード通常（0.5%）"');
    html=html.replace(/((?:first|second|third):)"三菱UFJカード"/g,'$1"三菱UFJカード（12.5%）"');
    html=html.replace(/((?:first|second|third):)"現金＋オーケークラブ"/g,'$1"現金＋オーケークラブ（食料品3%相当割引）"');

    html=html.replaceAll('note:"三井住友対象"','note:"Oliveクレジットモードなら8%（スマホタッチ／対象モバイルオーダー）。通常利用は0.5%。"');
    html=html.replaceAll('note:"三菱UFJ対象"','note:"三菱UFJカード対象店。あなたのMDCアプリ表示は現在12.5%（2026/9/6確認）。"');
    html=html.replaceAll('note:"特約対象外"','note:"特約対象外：PayPayは1.5%。三井住友カード・Olive通常0.5%、三菱UFJカード通常0.5%。"');
    html=html.replace('note:"店頭ではなくモバイルオーダー前提"','note:"スタバはアプリ／App Clip経由のApple PayによるモバイルオーダーでOliveクレジットモード8%。通常利用は0.5%。"');

    const patchScript=`
(function(){
  const PAYPAY="PayPay（1.5%）";
  const RAKUTEN_PAY="楽天ペイ残高（1.5%）";
  const SMBC_NORMAL="三井住友カード／Olive通常（0.5%）";
  const MUFG_TARGET="三菱UFJカード（12.5%）";
  const OK_CASH="現金＋オーケークラブ（食料品3%相当割引）";

  STORE_DATA.forEach(s=>{ s.rakutenPoint="公式の現行楽天ポイントカード対応を確認できず"; });

  function eachStore(name, fn){ STORE_DATA.filter(s=>s.store===name).forEach(fn); }
  function pointYes(names, text){ names.forEach(name=>eachStore(name,s=>s.rakutenPoint=text)); }
  function pointEnded(names, text){ names.forEach(name=>eachStore(name,s=>s.rakutenPoint=text)); }

  pointYes(["ガスト","バーミヤン","しゃぶ葉","夢庵","ジョナサン","ステーキガスト","むさしの森珈琲","から好し","藍屋","とんから亭","La Ohana","魚屋路","桃菜"],"対応：提示で+0.5%（200円税込につき1ポイント）");
  pointYes(["すき家","はま寿司","なか卯","ココス","ジョリーパスタ","ビッグボーイ","ヴィクトリアステーション","熟成焼肉いちばん","オリーブの丘","ゼッテリア","華屋与兵衛","久兵衛屋","かつ庵"],"対応：提示で+0.5%（原則200円税込につき1ポイント・一部店舗除く）");
  pointYes(["ケンタッキー"],"対応：提示で約+0.5%（200円税抜につき1ポイント）");
  pointYes(["吉野家"],"対応：提示で約+0.5%（200円税抜につき1ポイント）");
  pointYes(["くら寿司"],"対応：提示で約+0.5%（200円税抜につき1ポイント）");
  pointYes(["東急ストア"],"対応：提示で約+0.5%（200円税抜につき1ポイント）");
  pointYes(["タリーズ"],"対応：提示で+0.5%（200円税込につき1ポイント）");

  pointEnded(["マクドナルド"],"非対応：楽天ポイントカードは2024年1月14日で終了");
  pointEnded(["丸亀製麺"],"非対応：楽天ポイントカードは2024年5月31日で終了");
  pointEnded(["CoCo壱番屋"],"非対応：楽天ポイントカードの進呈・利用は終了");

  // 三菱UFJ 12.5%とOlive 8%の両方が対象の店は、現在値の高い三菱UFJを優先。
  eachStore("セブン-イレブン", s=>{
    s.first=MUFG_TARGET;
    s.second="Olive クレジットモード スマホタッチ（8%）";
    s.third=PAYPAY;
    s.note="三菱UFJカードはMDCアプリ表示12.5%（2026/9/6確認）。Oliveは8%。";
  });
  eachStore("ローソン", s=>{
    s.first=MUFG_TARGET;
    s.second="Olive クレジットモード スマホタッチ（8%）";
    s.third=PAYPAY;
    s.note="三菱UFJカードはMDCアプリ表示12.5%（2026/9/6確認）。Oliveは8%。";
  });

  ["すき家","吉野家","はま寿司","ココス"].forEach(name=>{
    eachStore(name,s=>{ s.second=RAKUTEN_PAY; s.third=PAYPAY; });
  });

  eachStore("東急ストア", s=>{
    s.first=MUFG_TARGET; s.second=RAKUTEN_PAY; s.third=PAYPAY;
    s.note="三菱UFJカードはMDCアプリ表示12.5%。楽天ペイの支払い還元と楽天ポイントカード提示分は別表示。";
  });

  ["ジョリーパスタ","ビッグボーイ","ヴィクトリアステーション","熟成焼肉いちばん","オリーブの丘","華屋与兵衛","久兵衛屋","なか卯","かつ庵","ゼッテリア","タリーズ"].forEach(name=>{
    eachStore(name,s=>{
      if(String(s.first).startsWith("PayPay")) s.first=RAKUTEN_PAY;
      if(String(s.second).includes("PayPay")) s.second=RAKUTEN_PAY;
    });
  });

  eachStore("CoCo壱番屋", s=>{
    s.first=PAYPAY; s.second=SMBC_NORMAL; s.third="三菱UFJカード通常（0.5%）";
    s.note="楽天ポイントカードは現在非対応。楽天ペイで支払ってもポイントカード提示分は付きません。";
  });

  eachStore("オーケー", s=>{
    s.first=MUFG_TARGET; s.second=OK_CASH; s.third=PAYPAY;
    s.note="三菱UFJカードはMDCアプリ表示12.5%。オーケークラブは現金払いの食料品（酒類除く）が3/103＝3%相当額割引。";
  });

  const fresh=STORE_DATA.find(s=>s.store==="フレッシュネスバーガー");
  if(!fresh){
    STORE_DATA.push({
      store:"フレッシュネスバーガー",
      aliases:["フレッシュネスバーガー","フレッシュネス","freshness burger","freshnessburger"],
      first:"Olive クレジットモード スマホタッチ（8%）",
      second:PAYPAY,
      third:SMBC_NORMAL,
      rakutenPoint:"公式の現行楽天ポイントカード対応を確認できず",
      note:"2026年8月1日から三井住友カード高還元の対象。"
    });
  }
})();

function paymentConditionSummary(store){
  const methods=[store.first,store.second,store.third].join(" ");
  const out=[];
  if(methods.includes("楽天ペイ残高")){
    out.push("楽天ペイ1.5%：適用月の前々月16日〜前月15日に、対象の楽天ポイントカードを2回以上提示し、1ポイント以上獲得。未達なら最大1.0%。");
  }
  if(methods.includes("三菱UFJカード（12.5%）")){
    out.push("三菱UFJ：あなたのMDCアプリ表示は現在12.5%（2026/9/6 08:59確認）。プログラム参加には三菱UFJ銀行を支払口座に設定＋MDCアプリからエントリーが必要。基本7%に、MDCアプリ月1回ログイン・月5万円以上利用・Apple Pay（QUICPay）利用またはグローバルポイント Walletチャージ等の条件達成分が上乗せされる。");
  }
  if(methods.includes("Olive クレジットモード")){
    out.push("Olive 8%：対象店舗でクレジットモードをスマホのタッチ決済、または対象のモバイルオーダーで利用。");
  }
  return out.join(" / ");
}
`;

    html=html.replace('setupEmbeddedAppIcons();',patchScript+'\nsetupEmbeddedAppIcons();');

    html=html.replace(
      '<div class="note">\n      <strong>備考：</strong>${escapeHtml(store.note)}\n    </div>',
      '<div class="note" style="background:#e7f7ff;">\n      <strong>還元条件：</strong>${escapeHtml(paymentConditionSummary(store) || "特別な達成条件なし")}\n    </div>\n\n    <div class="note" style="background:#fff4d6;">\n      <strong>楽天ポイントカード：</strong>${escapeHtml(store.rakutenPoint || "未確認")}\n    </div>\n\n    <div class="note">\n      <strong>備考：</strong>${escapeHtml(store.note)}\n    </div>'
    );

    html=html.replace('<th>備考</th>','<th>楽天ポイントカード</th><th>備考</th>');
    html=html.replace('<td>${escapeHtml(store.note)}</td>','<td>${escapeHtml(store.rakutenPoint || "未確認")}</td><td>${escapeHtml(store.note)}</td>');

    html=html.replace('候補を選ぶと、そのお店のおすすめ支払い方法1〜3位をすぐ表示します。','候補を選ぶと、おすすめ支払い方法1〜3位、還元条件、楽天ポイントカード対応状況を別々に表示します（2026年9月6日時点）。');
    html=html.replace('店舗候補はOpenStreetMapの登録状況に依存します。','店舗候補はOpenStreetMapの登録状況に依存します。<br><strong>PayPayは1.5%、三菱UFJ対象店はあなたの現在値12.5%で表示。楽天ペイの支払い還元と楽天ポイントカード提示分は別表示です。</strong>');

    document.open();
    document.write(html);
    document.close();
  }catch(err){
    document.body.innerHTML='<main><strong>読み込みに失敗しました</strong><span>'+String(err.message||err)+'</span></main>';
  }
})();
</script>
</body>
</html>
