t-weight:800;white-space:nowrap}.cand small{margin-left:4px;color:#969ca5}.welcome{padding:16px 3px 4px}.heroCopy{padding:16px 3px 12px}.kicker{font-size:11px;color:#818793;letter-spacing:.1em;font-weight:850}.welcome h1{font-size:29px;line-height:1.12;letter-spacing:-.055em;font-weight:880;margin:6px 0 0}.welcome h1 span{background:linear-gradient(100deg,#111318 10%,#4f6df5 80%);-webkit-background-clip:text;background-clip:text;color:transparent}.lead{font-size:13px;line-height:1.65;color:#858b95;font-weight:630;margin-top:9px}.ql{margin:12px 3px 6px;font-size:9.5px;color:#969ba5;letter-spacing:.11em;font-weight:850}.quick{display:flex;gap:8px;overflow:auto;padding:1px 1px 8px;scrollbar-width:none}.quick button{flex:0 0 auto;border:0;background:#fff;border-radius:15px;padding:10px 12px;font-size:11.5px;font-weight:800;color:#353942;box-shadow:0 5px 16px rgba(30,41,59,.05),inset 0 0 0 1px var(--line)}.notice{margin-top:7px;border-radius:20px;padding:13px 14px;background:rgba(255,255,255,.82);border:1px solid rgba(255,255,255,.92);box-shadow:var(--shadow);font-size:11px;line-height:1.55;color:#8a909a;font-weight:650}.result{display:none;padding-top:5px}.result.show{display:block}.sheet{background:#fff;border-radius:26px;padding:12px;box-shadow:var(--shadow),inset 0 0 0 1px rgba(15,17,21,.04)}.storehead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:2px 2px 10px}.hint{font-size:9.5px;color:#8b919b;letter-spacing:.07em;font-weight:850}.store{font-size:22px;line-height:1.15;font-weight:880;letter-spacing:-.045em;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:75vw}.reset{border:0;background:#f1f2f5;color:#707681;border-radius:11px;padding:7px 9px;font-size:10px;font-weight:800}.hero{--c:#4f6df5;position:relative;overflow:hidden;min-height:124px;padding:14px;border-radius:20px;background:linear-gradient(138deg,#0d0f13,#171b22 58%,#222831);color:#fff;box-shadow:0 14px 30px rgba(0,0,0,.16)}.hero:after{content:"";position:absolute;width:165px;height:165px;border-radius:50%;right:-58px;top:-78px;background:var(--c);opacity:.5}.herotop,.herobody{position:relative;z-index:2}.herotop{display:flex;justify-content:space-between;align-items:center}.pill{font-size:8.5px;font-weight:900;letter-spacing:.1em;background:rgba(255,255,255,.12);border-radius:999px;padding:5px 8px}.rate{font-size:29px;font-weight:920;letter-spacing:-.055em}.method{font-size:22px;font-weight:900;letter-spacing:-.04em;margin-top:18px}.sub{font-size:10px;color:rgba(255,255,255,.62);font-weight:680;margin-top:4px}.ranks{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:7px}.rank{background:#f6f7fa;border-radius:16px;padding:10px 11px;min-width:0}.rl{font-size:8.5px;color:#8d939d;font-weight:900;letter-spacing:.05em}.rm{display:flex;justify-content:space-between;gap:5px;margin-top:3px;align-items:baseline}.rn{font-size:12.5px;font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rr{font-size:13px;font-weight:920;white-space:nowrap}.section{margin-top:8px}.sh{display:flex;justify-content:space-between;margin:0 2px 5px}.st{font-size:9px;color:#858b95;font-weight:900}.sn{font-size:8.5px;color:#a0a5ae}.pts{display:flex;gap:5px;overflow:auto;scrollbar-width:none}.pt{flex:0 0 auto;border-radius:999px;padding:7px 9px;font-size:10px;font-weight:830;background:#f5f6f8;color:#424750}.r{background:#fff1f2;color:#a3182b}.p{background:#fff5df;color:#a76600}.d{background:#fff0f1;color:#c11a2d}.v{background:#eef8f5;color:#08725c}.s{background:#f0f1ff;color:#4b57b8}.combo{margin-top:7px;border:1px solid #dfe4ff;background:linear-gradient(135deg,#eef1ff,#f7f5ff);border-radius:16px;padding:10px 11px;display:flex;gap:8px}.plus{width:27px;height:27px;border-radius:9px;background:#fff;color:#5368e9;display:grid;place-items:center;font-weight:900;flex:0 0 auto}.ck{font-size:8.5px;color:#6674b9;font-weight:900}.ct{font-size:10.5px;line-height:1.45;color:#495474;font-weight:700;margin-top:2px}details{margin-top:7px;border-top:1px solid #eceef2}summary{list-style:none;padding:9px 2px 4px;color:#7c8492;font-size:10px;font-weight:850;display:flex;justify-content:space-between}summary::-webkit-details-marker{display:none}summary:after{content:"＋";font-size:16px}.detail{background:#f7f8fa;border-radius:12px;padding:8px 9px;margin-top:6px}.detail b{display:block;font-size:8.5px;color:#8a9099;margin-bottom:4px}.detail p{margin:0;font-size:10px;line-height:1.5;color:#5e6570;font-weight:670}.chips{display:flex;flex-wrap:wrap;gap:4px}.chip{border:1px solid #e3e6eb;background:#fff;border-radius:8px;padding:5px 7px;color:#5c626d;font-size:9px;font-weight:760}.hidden{display:none!important}@media(max-width:430px){.app{padding-left:10px;padding-right:10px}.searchbox,.geo{height:46px}.welcome h1{font-size:27px}.sheet{border-radius:22px;padding:9px}.hero{min-height:112px;padding:12px}.method{font-size:20px;margin-top:14px}.rate{font-size:26px}}@media(max-height:760px) and (max-width:500px){.bar{display:none}.top{padding-top:6px}.welcome{padding-top:8px}.heroCopy{padding:10px 3px 8px}.lead,.notice{display:none}.sheet{padding:9px}.storehead{padding-bottom:7px}.hero{min-height:105px}.ranks{margin-top:6px}.section{margin-top:7px}.combo{margin-top:6px}}

<body>
<div class="app">
<header class="top">
  <div class="bar"><div class="brand">支払いチェッカー</div><div class="ver">V3.3 · LOCATION</div></div>
  <div class="searchrow">
    <label class="searchbox"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="search" class="search" type="search" placeholder="店名を検索  例：ジョリパ、セブン"></label>
    <button id="geo" class="geo" aria-label="現在地から探す"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
  </div>
  <div id="status" class="status"></div><div id="cands" class="cands"></div>
</header>
<main>
  <section id="welcome" class="welcome"><div class="heroCopy"><div class="kicker">PAYMENT COMPASS</div><h1>その店で、<span>いちばん得な払い方</span>だけ。</h1><div class="lead">店名を入れるか、現在地ボタンをタップ。支払いと提示ポイントを分けて、すぐ比較します。</div></div><div class="ql">QUICK ACCESS</div><div id="quick" class="quick"></div><div class="notice">PayPayは1.5%で統一。三菱UFJ対象店はMDCアプリ表示12.5%を現在値として使用。</div></section>
  <section id="result" class="result"></section>
</main>
</div>
<script>
'use strict';const $=id=>document.getElementById(id),P=(n,r,k='s',x='')=>({n,r,k,x}),Y=(n,r,x='')=>({n,r,x});
const A={olive:['ミニストップ','マクドナルド','モスバーガー','ケンタッキー','吉野家','すき家','サイゼリヤ','ガスト','バーミヤン','しゃぶ葉','ジョナサン','夢庵','から好し','はま寿司','かっぱ寿司','ココス','ドトール','エクセルシオール'],mufg:['くら寿司','スシロー','松屋','松のや','マイカリー食堂','ピザハット','ゼッテリア','オーケー','東急ストア','三和・フードワン','オオゼキ','肉のハナマサ','ジャパンミート'],plain:['CoCo壱番屋','かつや','からやま','丸亀製麺','びっくりドンキー','横浜家','天狗','魁力屋','一風堂','タリーズ','なか卯','ジョリーパスタ','ビッグボーイ','オリーブの丘']};
const AL={'ジョリーパスタ':['ジョリパ'],'セブン-イレブン':['セブン','セブンイレブン'],'オーケー':['OK','オケ','オーケーストア'],'マクドナルド':['マック','マクド'],'ケンタッキー':['ケンタ'],'バーミヤン':['バミ'],'はま寿司':['はま'],'丸亀製麺':['丸亀'],'CoCo壱番屋':['ココイチ'],'タリーズ':['タリ']};
function payset(n){if(n==='セブン-イレブン'||n==='ローソン')return[Y('三菱UFJカード','12.5%'),Y('Olive','8%'),Y('PayPay','1.5%')];if(n==='オーケー')return[Y('三菱UFJカード','12.5%'),Y('OKクラブ現金','3%相当','対象食料品'),Y('PayPay','1.5%')];if(n==='東急ストア')return[Y('三菱UFJカード','12.5%'),Y('楽天ペイ','1.5%','条件達成時'),Y('PayPay','1.5%')];if(n==='ジョリーパスタ')return[Y('楽天ペイ','1.5%','条件達成時'),Y('PayPay','1.5%'),Y('d払い','1.0%','dカード設定時'),Y('au PAY','0.5%')];if(A.mufg.includes(n))return[Y('三菱UFJカード','12.5%'),Y('PayPay','1.5%'),Y('Olive通常','0.5%')];if(A.olive.includes(n))return[Y('Olive','8%'),Y('PayPay','1.5%'),Y('三菱UFJ通常','0.5%')];if(n==='タリーズ')return[Y('楽天ペイ','1.5%','条件達成時'),Y('PayPay','1.5%'),Y('Olive通常','0.5%')];return[Y('PayPay','1.5%'),Y('Olive通常','0.5%'),Y('三菱UFJ通常','0.5%')]}
function points(n){const sky=['ガスト','バーミヤン','しゃぶ葉','ジョナサン','夢庵','から好し'];if(sky.includes(n))return[P('楽天','0.5%','r'),P('d','0.5%','d'),P('V','0.5%','v'),P('すかいらーく','0.5%','s','併用可')];const zen=['はま寿司','ココス','なか卯','ジョリーパスタ','ビッグボーイ','オリーブの丘'];if(zen.includes(n))return[P('楽天','0.5%','r'),P('d','0.5%','d'),P('V','0.5%','v')];if(n==='すき家')return[P('楽天','0.5%','r'),P('Ponta','0.5%','p'),P('d','0.5%','d'),P('V','0.5%','v')];if(n==='ローソン')return[P('Ponta','約0.5〜1.0%','p'),P('d','約0.5〜1.0%','d')];if(n==='ケンタッキー')return[P('楽天','約0.5%','r'),P('Ponta','約0.5%','p')];if(n==='吉野家'||n==='くら寿司'||n==='タリーズ'||n==='東急ストア')return[P('楽天','約0.5%','r')];if(n==='丸亀製麺'||n==='マクドナルド')return[P('楽天ポイント','終了','s')];return[]}
function combo(n){if(n==='ジョリーパスタ')return'楽天0.5%＋PayPay1.5%＝2.0%。楽天＋楽天ペイでも2.0%。';if(n==='ローソン')return'PayPay1.5%＋Pontaで約2.0〜2.5%。三菱UFJなら約13.0〜13.5%。';if(n==='すき家')return'PayPay1.5%＋提示0.5%＝2.0%。Ponta＋au PAYなら1.0%。';if(n==='東急ストア')return'楽天約0.5%＋TOKYU POINT約0.5%を併用可。';if(points(n).length)return'提示ポイントは支払い還元とは別に加算できます。';return'支払い還元を比較。'}
function cond(n){if(n==='ジョリーパスタ'||n==='タリーズ')return'楽天ペイ1.5%は対象期間に楽天ポイントカードを2回以上提示してポイント獲得した場合。未達時は最大1.0%。';if(n==='セブン-イレブン'||n==='ローソン'||A.mufg.includes(n))return'三菱UFJはMDCアプリ表示12.5%を現在値として使用。対象店・条件を満たす場合。';if(A.olive.includes(n))return'Olive 8%は対象店でクレジットモードのスマホタッチ等を利用。';return'特別な達成条件なし。'}
const names=['セブン-イレブン','ローソン',...A.olive,...A.mufg,...A.plain],seen=new Set(),S=[];for(const n of names){if(seen.has(n))continue;seen.add(n);S.push({n,a:[n,...(AL[n]||[])],pay:payset(n),pts:points(n),combo:combo(n),cond:cond(n)})}
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c])),N=s=>String(s||'').normalize('NFKC').toLowerCase().replace(/[ー‐-‒–—―\-−\s　・･'’`]/g,'').trim(),R=s=>{const m=String(s).match(/(12\.5|8|3|1\.5|1\.0|0\.5)%/);return m?+m[1]:0},C=s=>s.includes('PayPay')?'#ff3150':s.includes('楽天')?'#d21d3d':s.includes('三菱UFJ')?'#c33a4c':s.includes('Olive')?'#25c89b':s.includes('au')?'#ff9c43':s.includes('d払い')?'#ef4859':'#7d8cff',T=(a,b)=>{const d=R(b.r)-R(a.r);if(d)return d;if(a.n==='PayPay'&&b.n==='楽天ペイ')return -1;if(a.n==='楽天ペイ'&&b.n==='PayPay')return 1;return 0};
function show(s,ctx='検索結果'){const p=[...s.pay].sort(T),a=p[0]||Y('—',''),b=p[1]||Y('—',''),c=p[2]||Y('—',''),ph=s.pts.length?s.pts.map(x=>`<span class="pt ${x.k}">${E(x.n)} <b>${E(x.r)}</b>${x.x?' · '+E(x.x):''}</span>`).join(''):'<span class="pt">提示ポイントなし / 未確認</span>',chips=p.map(x=>`<span class="chip">${E(x.n)} ${E(x.r)}${x.x?' · '+E(x.x):''}</span>`).join('');$('welcome').classList.add('hidden');$('cands').innerHTML='';$('result').innerHTML=`<div class="sheet"><div class="storehead"><div><div class="hint">BEST PAYMENT · ${E(ctx)}</div><div class="store">${E(s.n)}</div></div><button id="reset" class="reset">別の店</button></div><div class="hero" style="--c:${C(a.n)}"><div class="herotop"><span class="pill">BEST CHOICE</span><span class="rate">${E(a.r)}</span></div><div class="herobody"><div class="method">${E(a.n)}</div><div class="sub">${E(a.x||'現在の設定で最も高い還元を優先')}</div></div></div><div class="ranks"><div class="rank"><div class="rl">SECOND</div><div class="rm"><span class="rn">${E(b.n)}</span><span class="rr">${E(b.r)}</span></div></div><div class="rank"><div class="rl">THIRD</div><div class="rm"><span class="rn">${E(c.n)}</span><span class="rr">${E(c.r)}</span></div></div></div><div class="section"><div class="sh"><div class="st">会計前に提示</div><div class="sn">支払いとは別</div></div><div class="pts">${ph}</div></div><div class="combo"><div class="plus">＋</div><div><div class="ck">BEST COMBINATION</div><div class="ct">${E(s.combo)}</div></div></div><details><summary>条件とその他の支払い</summary><div class="detail"><b>還元条件</b><p>${E(s.cond)}</p></div><div class="detail"><b>支払い候補</b><div class="chips">${chips}</div></div></details></div>`;$('result').classList.add('show');$('reset').onclick=()=>{$('result').classList.remove('show');$('welcome').classList.remove('hidden');$('search').value='';$('search').focus()}}
function match(q){const n=N(q);return n?S.filter(s=>s.a.some(a=>{const x=N(a);return x===n||x.includes(n)||n.includes(x)})).slice(0,10):[]}
function cands(a){$('cands').innerHTML=a.map((s,i)=>`<button class="cand" data-i="${i}">${E(s.n)}</button>`).join('');[...$('cands').querySelectorAll('button')].forEach((b,i)=>b.onclick=()=>show(a[i]))}
$('search').oninput=e=>{const q=e.target.value.trim(),a=match(q);cands(a);$('status').textContent=q&&!a.length?'該当する登録店がありません':'';$('status').className='status'+(q&&!a.length?' show err':'');if(a.length===1&&a[0].a.some(x=>N(x)===N(q)))show(a[0])};
const Q=['ジョリーパスタ','セブン-イレブン','ローソン','すき家','オーケー'];$('quick').innerHTML=Q.map((n,i)=>`<button data-i="${i}">${E(n)}</button>`).join('');[...$('quick').querySelectorAll('button')].forEach((b,i)=>b.onclick=()=>show(S.find(s=>s.n===Q[i])));
const OVERPASS=['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter'];
function distM(a,b,c,d){const RR=6371000,t=x=>x*Math.PI/180,dl=t(c-a),dn=t(d-b),x=Math.sin(dl/2)**2+Math.cos(t(a))*Math.cos(t(c))*Math.sin(dn/2)**2;return Math.round(2*RR*Math.atan2(Math.sqrt(x),Math.sqrt(1-x)))}
function matchText(text){const n=N(text);let best=null;for(const s of S){for(const a of s.a){const x=N(a);if(!x)continue;let sc=0;if(n===x)sc=100;else if(n.includes(x))sc=80;else if(x.includes(n)&&n.length>=2)sc=55;if(sc&&(!best||sc>best.sc))best={s,sc}}}return best}
async function overpassNearby(lat,lng,radius=500){const q=`[out:json][timeout:16];(node(around:${radius},${lat},${lng})["name"];way(around:${radius},${lat},${lng})["name"];relation(around:${radius},${lat},${lng})["name"];);out center tags;`;let last;for(const url of OVERPASS){try{const ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),10000);const r=await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:q,signal:ctl.signal});clearTimeout(timer);if(!r.ok)throw new Error('api');return await r.json()}catch(e){last=e}}throw last||new Error('nearby')}
function nearbyList(json,lat,lng){const m=new Map();for(const el of json.elements||[]){const tags=el.tags||{},txt=[tags.name,tags['name:ja'],tags.brand,tags.operator].filter(Boolean).join(' / '),hit=matchText(txt);if(!hit)continue;const la=typeof el.lat==='number'?el.lat:el.center&&el.center.lat,lo=typeof el.lon==='number'?el.lon:el.center&&el.center.lon;if(typeof la!=='number'||typeof lo!=='number')continue;const d=distM(lat,lng,la,lo),old=m.get(hit.s.n);if(!old||d<old.d)m.set(hit.s.n,{s:hit.s,d})}return[...m.values()].sort((a,b)=>a.d-b.d).slice(0,10)}
function geoCands(list){$('cands').innerHTML=list.map((x,i)=>`<button class="cand" data-i="${i}">${E(x.s.n)} <small>${x.d}m</small></button>`).join('');[...$('cands').querySelectorAll('button')].forEach((b,i)=>b.onclick=()=>show(list[i].s,`現在地から約${list[i].d}m`))}
$('geo').onclick=()=>{if(!navigator.geolocation){$('status').textContent='この端末では位置情報を利用できません。';$('status').className='status show err';return}$('status').textContent='現在地を取得しています…';$('status').className='status show';navigator.geolocation.getCurrentPosition(async pos=>{const lat=pos.coords.latitude,lng=pos.coords.longitude;$('status').textContent='近くの対象店を探しています…';try{let list=nearbyList(await overpassNearby(lat,lng,500),lat,lng);if(!list.length)list=nearbyList(await overpassNearby(lat,lng,900),lat,lng);geoCands(list);$('status').textContent=list.length?`${list.length}件見つかりました。店を選んでください。`:'近くに登録対象店が見つかりませんでした。';$('status').className='status show'+(list.length?'':' err')}catch(e){$('status').textContent='周辺店舗の取得に失敗しました。店名検索はそのまま使えます。';$('status').className='status show err'}},err=>{$('status').textContent=err&&err.code===1?'位置情報の許可が必要です。Safariのサイト設定で許可してください。':'位置情報を取得できませんでした。';$('status').className='status show err'},{enableHighAccuracy:true,timeout:10000,maximumAge:30000})};
</script>
