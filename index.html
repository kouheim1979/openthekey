<body>
<div class="app">
  <header class="glassbar">
    <div class="titlebar"><div class="brand">支払いチェッカー</div><div class="version">UPDATED 09.06</div></div>
    <div class="searchrow">

  <main>

      <div class="heroCopy">
        <div class="heroKicker">PAYMENT COMPASS</div>
        <h1 class="heroTitle">その店で、<span>いちばん得な払い方</span>だけ。</h1>
        <div class="heroSub">店名を入れるか、現在地ボタンをタップ。支払いと提示ポイントを分けて、すぐ比較します。</div>
      </div>
      <div class="quicklabel">Quick access</div>
      <div id="quick" class="quick"></div>
      <div class="hintcard">
        <div class="hinticon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 10h18"/></svg></div>
        <div><div class="hintmain">上位3つ＋提示ポイントまで1画面</div><div class="hintsub">細かい条件や4位以下は「詳細」だけに収納</div></div>
      </div>
    </section>
    <section id="result" class="result"></section>
    <div class="footer">還元率は利用条件・店舗・キャンペーンで変わる場合があります。三菱UFJ対象店はMDCアプリ表示12.5%を現在値として使用。</div>
  </main>
</div>

<script>

const PAYPAY="PayPay",RAKUTEN="楽天ペイ残高",AU="au PAY",DPAY="d払い",MUFG="三菱UFJカード",OLIVE="Olive クレジットモード";

function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]));}
function norm(v){return String(v||"").normalize("NFKC").toLowerCase().replace(/[ー‐-‒–—―\-−\s　・･'’`]/g,"").replace(/株式会社|有限会社|合同会社|店$/g,"").trim();}
function uniq(a){return Array.from(new Set((a||[]).filter(Boolean)));}

function pay(name,rate,extra=""){return `${name}（${rate}${extra?"・"+extra:"}）`;}
function numericRate(v){const m=String(v||"").match(/(12\.5|11|8|3|1\.5|1\.0|0\.5)%/);return m?Number(m[1]):0;}
function rateLabel(v){const m=String(v||"").match(/(?:12\.5|11|8|3|1\.5|1\.0|0\.5)%/);return m?m[0]:"";}

function normalizePay(v){const s=String(v||"");if(/^PayPay/.test(s))return pay(PAYPAY,"1.5%");if(s==="三菱UFJカード")return pay(MUFG,"12.5%");if(s==="三菱UFJカード通常")return pay("三菱UFJカード通常","0.5%");if(s.includes("三井住友カード スマホタッチ")||s.includes("三井住友カード モバイルオーダー"))return pay(OLIVE,"8%");if(s==="三井住友カード通常")return pay("三井住友カード／Olive通常","0.5%");if(s==="現金＋オーケークラブ")return "現金＋オーケークラブ（食料品3%相当割引）";return s;}
function sortPayments(list){return list.map((v,i)=>({v:normalizePay(v),i})).sort((a,b)=>numericRate(b.v)-numericRate(a.v)||a.i-b.i).map(x=>x.v);}

function decorate(src){const s={...src};addAliases(s);s.first=normalizePay(s.first);s.second=normalizePay(s.second);s.third=normalizePay(s.third);s.options=uniq([s.first,s.second,s.third]);s.points=[];s.combo="提示ポイントがある場合は、支払い還元とは別に加算できます。";s.conditions=[];

function mergeStores(raw){const map=new Map();for(const r of raw){const e=decorate(r);if(!map.has(e.store))map.set(e.store,e);else map.get(e.store).aliases=uniq([...map.get(e.store).aliases,...e.aliases]);}return[...map.values()];}
async function loadFullStores(){const r=await fetch("./legacy.html?v=20260906-stable",{cache:"no-store"});if(!r.ok)throw new Error("legacy");const text=await r.text();const marker="const STORE_DATA =",m=text.indexOf(marker),a=text.indexOf("[",m),b=text.indexOf("];",a);if(m<0||a<0||b<0)throw new Error("format");const raw=Function('"use strict";return ('+text.slice(a,b+1)+')')();if(!Array.isArray(raw))throw new Error("data");return raw;}
function findMatches(q){const n=norm(q);if(!n)return[];const out=[];for(const s of STORES){let score=0;for(const a of s.aliases){const x=norm(a);if(!x)continue;if(n===x)score=Math.max(score,100);else if(x.includes(n)||n.includes(x))score=Math.max(score,n.length>=2?70:30);}if(score)out.push({store:s,score});}return out.sort((a,b)=>b.score-a.score).slice(0,9);}
function setStatus(msg,type=""){const e=$("status");e.textContent=msg;e.className="status"+(msg?" show":"")+(type?" "+type:"");}
function renderCandidates(items,geo=false){const box=$("candidates");box.innerHTML="";for(const item of items){const s=geo?item.store:item;if(!s)continue;const b=document.createElement("button");b.className="candidate";b.innerHTML=`<b>${esc(s.store)}</b>${geo&&item.distance!=null?`<small>${item.distance}m</small>`:""}`;b.onclick=()=>renderResult(s,geo?item:null);box.appendChild(b);}}
function pointHtml(points){if(!points||!points.length)return'<span class="point">提示ポイントなし / 未確認</span>';return points.map(p=>`<span class="point ${p.kind||pointKind(p.name)}">${esc(p.name)} <strong>${esc(p.rate)}</strong>${p.note?` · ${esc(p.note)}`:""}</span>`).join("");}
function renderResult(s,ctx=null){$("welcome").classList.add("hidden");$("candidates").innerHTML="";const context=ctx&&ctx.distance!=null?`現在地から約${ctx.distance}m`:"検索結果";const detailPayments=s.options.map(v=>`<span class="paychip">${esc(v)}</span>`).join("");const cond=s.conditions.length?s.conditions.join(" "):"特別な達成条件なし。キャンペーンや店舗条件は会計前に確認してください。";const brand=brandColor(s.first);$("result").innerHTML=`
 <div class="sheet">
  <div class="storehead"><div><div class="storeeyebrow">BEST PAYMENT · ${esc(context)}</div><div class="storename">${esc(s.store)}</div></div><button id="reset" class="reset">別の店</button></div>
  <div class="payhero" style="--brand:${brand}"><div class="paytop"><span class="bestpill">BEST CHOICE</span><span class="rate">${esc(rateLabel(s.first))}</span></div><div class="method">${esc(shortPay(s.first))}</div><div class="methodsub">現在の設定で最も高い還元を優先</div></div>
  <div class="rankrow"><div class="rankcard"><div class="ranklabel">SECOND</div><div class="rankmethod"><span class="rankname">${esc(shortPay(s.second))}</span><span class="rankrate">${esc(rateLabel(s.second))}</span></div></div><div class="rankcard"><div class="ranklabel">THIRD</div><div class="rankmethod"><span class="rankname">${esc(shortPay(s.third))}</span><span class="rankrate">${esc(rateLabel(s.third))}</span></div></div></div>
  <div class="section"><div class="sectionhead"><div class="sectiontitle">会計前に提示</div><div class="sectionnote">支払いとは別</div></div><div class="points">${pointHtml(s.points)}</div></div>
  <div class="combo"><div class="comboicon">＋</div><div><div class="combolabel">BEST COMBINATION</div><div class="combotext">${esc(s.combo)}</div></div></div>
  <details><summary>条件とその他の支払い</summary><div class="detailbody"><div class="detail"><h4>還元条件</h4><p>${esc(cond)}</p></div><div class="detail"><h4>使える主な支払い候補</h4><div class="paychips">${detailPayments}</div></div><div class="detail"><h4>備考</h4><p>${esc(s.note||"—")}</p></div></div></details>
 </div>`;$("result").classList.add("show");$("reset").onclick=()=>{$("search").value="";$("result").classList.remove("show");$("welcome").classList.remove("hidden");setStatus("");$("search").focus();};setStatus("");}
function renderQuick(){const q=$("quick");q.innerHTML="";for(const name of QUICK){const b=document.createElement("button");b.textContent=name;b.onclick=()=>{const hit=STORES.find(s=>s.store===name);if(hit)renderResult(hit);};q.appendChild(b);}}
function hav(a,b,c,d){const R=6371000,r=x=>x*Math.PI/180,dl=r(c-a),dn=r(d-b),x=Math.sin(dl/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(dn/2)**2;return 2*R*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));}
function matchStoreText(text){const n=norm(text);let best=null;for(const s of STORES){for(const a of s.aliases){const x=norm(a);if(!x)continue;let score=0;if(n===x)score=100;else if(n.includes(x))score=80;else if(x.includes(n)&&n.length>=2)score=55;if(score&&(!best||score>best.score))best={store:s,score};}}return best;}
async function fetchNearby(lat,lng,radius=350){const q=`[out:json][timeout:18];(node(around:${radius},${lat},${lng})["name"];way(around:${radius},${lat},${lng})["name"];relation(around:${radius},${lat},${lng})["name"];);out center tags;`;let last;for(const url of OVERPASS){try{const c=new AbortController(),t=setTimeout(()=>c.abort(),11000),r=await fetch(url,{method:"POST",headers:{"Content-Type":"text/plain;charset=UTF-8"},body:q,signal:c.signal});clearTimeout(t);if(!r.ok)throw new Error("api");return await r.json();}catch(e){last=e;}}throw last||new Error("nearby");}
function nearbyCandidates(json,lat,lng){const map=new Map();for(const el of json.elements||[]){const tags=el.tags||{},txt=[tags.name,tags["name:ja"],tags.brand,tags.operator].filter(Boolean).join(" / "),m=matchStoreText(txt);if(!m)continue;const la=typeof el.lat==="number"?el.lat:el.center?.lat,lo=typeof el.lon==="number"?el.lon:el.center?.lon;if(typeof la!=="number"||typeof lo!=="number")continue;const d=Math.round(hav(lat,lng,la,lo)),old=map.get(m.store.store);if(!old||d<old.distance)map.set(m.store.store,{store:m.store,distance:d});}return[...map.values()].sort((a,b)=>a.distance-b.distance).slice(0,10);}

// 主要店ですぐ起動。全店舗データは裏で補完するので、読み込み待ちで止まらない。
STORES=mergeStores(FALLBACK);renderQuick();setStatus("");
loadFullStores().then(raw=>{STORES=mergeStores(raw);renderQuick();}).catch(()=>{setStatus("主要店舗データで起動中。店名検索はそのまま使えます。","ok");});

$("search").addEventListener("input",e=>{const q=e.target.value.trim();if(!q){$("candidates").innerHTML="";setStatus("");return;}const hits=findMatches(q);renderCandidates(hits.map(x=>x.store));setStatus(hits.length?"":"該当する登録店がありません",hits.length?"":"error");if(hits.length===1&&hits[0].score===100)renderResult(hits[0].store);});
$("geo").addEventListener("click",()=>{if(!navigator.geolocation){setStatus("この端末では位置情報を使えません","error");return;}setStatus("近くの対象店を探しています…");navigator.geolocation.getCurrentPosition(async p=>{try{const items=nearbyCandidates(await fetchNearby(p.coords.latitude,p.coords.longitude),p.coords.latitude,p.coords.longitude);renderCandidates(items,true);setStatus(items.length?`${items.length}件見つかりました。店を選んでください。`:"近くに登録対象店が見つかりませんでした",items.length?"ok":"error");}catch(e){setStatus("周辺店舗の取得に失敗しました。店名検索を使ってください。","error");}},()=>setStatus("位置情報を取得できませんでした。店名検索を使ってください。","error"),{enableHighAccuracy:true,timeout:12000,maximumAge:30000});});
